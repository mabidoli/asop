[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asop-spec"
version = "0.1.0"
description = "The ASOP contract — shared gate schema, refusal vocabulary, and SOP record shape for any plane or harness that speaks it"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["agents", "asop", "coordination", "contract"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Standard library first, same discipline as the parent repo (CONTRIBUTING.md)
# — this package is imported by both the coordination plane and any harness
# that adopts it, so a dependency here is a dependency forced on both.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/mabidoli/asop"
Repository = "https://github.com/mabidoli/asop"
Specification = "https://github.com/mabidoli/asop/blob/main/ASOP.md"
Schema = "https://github.com/mabidoli/asop/tree/main/schema/v1"
Issues = "https://github.com/mabidoli/asop/issues"

[tool.hatch.build.targets.wheel]
packages = ["asop"]

# The normative artefacts ship INSIDE the wheel, not merely beside it in the
# sdist. A package called asop-spec that does not contain the spec would make
# an installed version unable to say what it conforms to; bundling them lets a
# reader validate against the exact schema their installed version speaks,
# offline, without fetching a URL that may have moved on.
[tool.hatch.build.targets.wheel.force-include]
"schema" = "asop/schema"
"ASOP.md" = "asop/ASOP.md"
"conformance/assertions.yaml" = "asop/conformance/assertions.yaml"
