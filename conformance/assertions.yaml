# Normative assertions extracted from ASOP.md
#
# Every rule in the prose that an implementation can be tested against, one
# entry each. This is the traceability layer between the specification and the
# conformance vectors: a vector cites an assertion id, an assertion cites a
# section, and a rule with no vector is visibly untested.
#
# Fields:
#   id          stable identifier, cited by conformance vectors
#   section     the ASOP.md section the rule comes from
#   rule        the rule as one imperative sentence
#   applies_to  gate | step | asop | attestation | revision | run
#               | handoff | join | requires (v3.5)
#               | entry | rework | manifest | journal | staleness | chain (v3.6)
#   testable    can a document alone prove or violate it
#   violation   what a document that breaks the rule looks like
#
# Extracted 2026-09-07 and checked: 107 unique ids, no missing fields, every
# applies_to in vocabulary, all 25 cited sections resolve to real headings in
# ASOP.md, no near-duplicate rules.
#
# KNOWN ERRATA surfaced by this extraction — the prose and the reference
# implementation disagree, so the assertions record the prose and these notes
# record the conflict:
#
#   A009 / ASOP.md 2.2 — RESOLVED 2026-09-07. The prose said every gate
#   carries a park clock and that a gate without a timeout is a deadlock,
#   while every implementation treated the group as optional. The prose was
#   relaxed to match: the clock is required where work can park, omitted
#   entirely by a caller with no parking concept, and declared as a whole or
#   not at all. Relaxing rather than tightening because an optional clock is
#   what lets a single-principal runtime adopt this at all.
#
#   ASOP.md 3.5 — "the outer step's gate, if any, applies to the inner run as
#   a whole", while the record contract refuses any body on a `uses` step.
#   schema/v1/step.yaml follows the stricter contract and says so.
#
# The `uses` erratum still needs a prose decision before v1 is called final.
#
# NEW RULE, 2026-09-07 — staged gates. A gate declaring `checks` takes one
# attestation per rung, each pinned to its index, and is answered only when
# every rung is present and passing. Added because the feature was previously
# unusable: a staged gate normalised to `check: None` and refused every
# possible attestation. Extracted 2026-09-08 as A103-A107; the ids are appended
# rather than renumbered into sequence, because a vector cites an id and an id
# that moves is worse than an id out of order.


