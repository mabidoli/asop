# Normative assertions extracted from ASOP.md
#
# Every rule in the prose that an implementation can be tested against, one
# entry each. This is the traceability layer between the specification and the
# conformance vectors: a vector cites an assertion id, an assertion cites a
# section, and a rule with no vector is visibly untested.
#
# Fields:
#   id          stable identifier, cited by conformance vectors
#   section     the ASOP.md section the rule comes from
#   rule        the rule as one imperative sentence
#   applies_to  gate | step | asop | attestation | revision | run
#   testable    can a document alone prove or violate it
#   violation   what a document that breaks the rule looks like
#
# Extracted 2026-09-07 and checked: 102 unique ids, no missing fields, every
# applies_to in vocabulary, all 25 cited sections resolve to real headings in
# ASOP.md, no near-duplicate rules.
#
# KNOWN ERRATA surfaced by this extraction — the prose and the reference
# implementation disagree, so the assertions record the prose and these notes
# record the conflict:
#
#   A009 / ASOP.md:96 — "Every gate carries a park clock and an escalation
#   path; a gate with no timeout is a deadlock." The implementation and
#   schema/v1/gate.yaml both treat the clock group as OPTIONAL: validate_gate
#   with require=() accepts a gate carrying no clock, and that is the
#   documented path for a caller with no park-clock concept. An implementer
#   reading the prose and one reading the code would disagree about whether
#   the same gate is valid.
#
#   ASOP.md 3.5 — "the outer step's gate, if any, applies to the inner run as
#   a whole", while the record contract refuses any body on a `uses` step.
#   schema/v1/step.yaml follows the stricter contract and says so.
#
# Both need a prose decision before v1 is called final.


- id: A001
