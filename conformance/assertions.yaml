- id: A092
  section: "8.4"
  rule: "propose requires unproposed adjudications exist; refuses otherwise."
  applies_to: asop
  testable: true
  violation: "The system runs the propose pass when all adjudications are already proposed."
- id: A093
  section: "8.4"
  rule: "promote requires run complete and no active ASOP for its task_type; refuses otherwise."
  applies_to: asop
  testable: true
  violation: "The system promotes an incomplete run or duplicates an active task_type."
- id: A094
  section: "9"
  rule: "Gate enforcement happens inside the domain that owns the bead, never in a shared plane."
  applies_to: gate
  testable: true
  violation: "The plane performs gate validation or status flipping."
- id: A095
  section: "9"
  rule: "A plane stays advisory and verifies attestations."
  applies_to: attestation
  testable: true
  violation: "The plane executes checks or blocks harnesses instead of verifying attestations."
- id: A096
  section: "9"
  rule: "Per gate, an implementation pins identity, environment, isolation, timeout, and idempotency."
  applies_to: gate
  testable: true
  violation: "A gate execution lacks pinned identity, environment, isolation, timeout, or idempotency guarantees."
- id: A097
  section: "9"
  rule: "Timeout is mandatory; expiry is failure, never a hang."
  applies_to: gate
  testable: true
  violation: "A gate execution hangs indefinitely past its timeout without transitioning to failure."
- id: A098
  section: "9"
  rule: "Re-running a passed gate is safe."
  applies_to: gate
  testable: true
  violation: "Re-executing a passed gate alters state or causes side effects."
- id: A099
  section: "9"
  rule: "Every human gate declares max_park_seconds and escalate_to."
  applies_to: gate
  testable: true
  violation: "A human gate definition omits the park clock or escalation target."
- id: A100
  section: "9"
  rule: "Silence past the deadline resolves by on_timeout."
  applies_to: gate
  testable: true
  violation: "A parked human gate remains indefinitely without triggering the configured on_timeout action."
- id: A101
  section: "9"
  rule: "Repair never substitutes for the work it repairs."
  applies_to: step
  testable: true
  violation: "A repair bead replaces the original failed step instead of filing alongside it."
- id: A102
  section: "9"
  rule: "Recursion is how the bound is honoured, not how it is broken."
  applies_to: asop
  testable: true
  violation: "Nesting is used to bypass the 7-step or 3-depth decomposition limits."
- id: A108
  section: "5.3"
  rule: "Judged and human attestations require a verdict with boolean passed and nonblank reason, attached to the attested check/stage."
  applies_to: attestation
  testable: true
  violation: "A judged or human attestation is accepted without a well-formed verdict."
- id: A109
  section: "5.3"
  rule: "Evidence passes only with exit status zero and a positive verdict when present."
  applies_to: attestation
  testable: true
  violation: "A negative verdict or nonzero exit status releases dependents."
#
# NEW RULES, 2026-10-10 — hand-offs (§3.7, v3.5). Extracted as A110-A134 from
# the section that reverses §11.4: what a finished run may file next is
# declared on the ASOP, and an engine refuses anything not declared. The
# vocabulary for `applies_to` gains `handoff` (a filing decision), `join` (may
# a deferred hand-off be filed yet) and `requires` (a start decision); all are
# questions about a run, but they are answered by different functions and an
# implementation can get one right and another wrong.
#
# Before release, A124, A125, A131 and A132 were rewritten and A133 added:
# A134 added: joins moved from the waiting procedure (`all_runs_done`, "settled") to the
# procedure that fans out (`after`). See CHANGELOG v3.5 for why.
- id: A110
  section: "3.7"
  rule: "An ASOP without outcomes, outputs, handoffs, on_escalate or requires is valid and standalone, exactly as before v3.5."
  applies_to: asop
  testable: true
  violation: "A record valid under v3.4 is refused under v3.5."
- id: A111
  section: "3.7"
  rule: "A hand-off's on_outcomes names only outcomes the ASOP declares in `outcomes`."
  applies_to: asop
  testable: true
  violation: "A misspelt outcome is accepted and the hand-off silently never fires."
- id: A112
  section: "3.7"
  rule: "A `many` hand-off declares subject_from, whose output is one the ASOP declares in `outputs`; a `one` hand-off declares none."
  applies_to: asop
  testable: true
  violation: "A fan-out reads an undeclared output, or has nothing to fan out over."
- id: A113
  section: "3.7"
  rule: "Input mapping references are `$subject`, `$subject.<field>` (one key; on a `many` hand-off only), `$run.inputs.<declared input>` or `$run.outputs.<declared output>`; anything else beginning with `$` is refused, `$$` writes a literal `$`, and names with surrounding whitespace are refused rather than stripped."
  applies_to: asop
  testable: true
  violation: "A mapping reads an undeclared input or output, a subject that does not exist, or two keys collide after stripping."
- id: A114
  section: "3.7"
  rule: "A hand-off target is {asop_id, version} or {asop_id, versions}, exactly one; versions is '>=N' or '>=N,<M' in ASCII digits with no spaces, N >= 1 and M > N."
  applies_to: asop
  testable: true
  violation: "A target carries both, neither, or a range grammar another engine would parse differently."
- id: A115
  section: "3.7"
  rule: "`requires` kinds are a closed list: run_done, human_approved. all_runs_done is refused with a pointer to joins (`after`)."
  applies_to: asop
  testable: true
  violation: "A record declares a start predicate an engine invented, which another engine cannot evaluate identically."
- id: A116
  section: "3.7"
  rule: "An ASOP may not hand off, escalate, or wait on runs of its own asop_id."
  applies_to: asop
  testable: true
  violation: "A procedure files itself with no bound."
- id: A117
  section: "3.7"
  rule: "A hand-off fires only on completion with an outcome in its on_outcomes, or on every completion when on_outcomes is absent."
  applies_to: handoff
  testable: true
  violation: "A run with an outcome outside on_outcomes files a successor."
- id: A118
  section: "3.7"
  rule: "A fired `many` hand-off files one run per subject subject_from yields (type-strict where/where_not; ids are strings or integers, unique as subjects); when the run wrote ACCEPTED requests for it, exactly those subjects. A refused request never narrows or cancels the declared expansion."
  applies_to: handoff
  testable: true
  violation: "A filtered-out or invented subject is filed, or one refused request silences the declared fan-out."
- id: A119
  section: "3.7"
  rule: "A fired `one` hand-off files one run whose subject is the chain. More than one request, or a request naming a subject, is refused and disregarded; the hand-off still fires."
  applies_to: handoff
  testable: true
  violation: "A `one` hand-off files twice, a run chooses its successor's subject, or a bad request cancels it."
- id: A120
  section: "3.7"
  rule: "A filed run's inputs are exactly the successor's declared inputs, computed from the declared mapping as scalars; a filing request carries no inputs."
  applies_to: handoff
  testable: true
  violation: "A run injects or overrides what a successor is handed, or a structure is passed through as an input."
- id: A121
  section: "3.7"
  rule: "A range resolves at filing to the successor's ACTIVE version inside it, and the filed run pins that version; none inside the range refuses."
  applies_to: handoff
  testable: true
  violation: "A run is filed against a version outside the declared range, or with no pin."
- id: A122
  section: "3.7"
  rule: "Filing is idempotent on the natural key {chain}|{asop_id}|{subject}|a{attempt} (parts percent-encoded); the same key with the same inputs is a recorded duplicate, not a refusal, and the engine files a higher attempt when re-filing downstream of a stale input."
  applies_to: handoff
  testable: true
  violation: "A replay files twice, a chain run filed by several predecessors is refused, or a stale re-file is swallowed as a duplicate."
- id: A123
  section: "3.7"
  rule: "Every refused request or hand-off is recorded with handoff_refused:<rule>; none is silently dropped, and none is repaired."
  applies_to: handoff
  testable: true
  violation: "A bad request is ignored, or corrected and filed."
- id: A124
  section: "3.7"
  rule: "A join is ready when every run its `after` hand-offs filed or found already filed for the SAME parent run is done, and no listed join is still waiting to be filed; zero such runs is ready. Runs filed by any other path are not part of it."
  applies_to: join
  testable: true
  violation: "A join fires when the first run finishes, waits forever on an empty fan-out, or waits on (or is fired by) runs some other path filed."
- id: A125
  section: "3.7"
  rule: "run_done(X) holds when X's chain run (subject = the chain) exists in this chain and its highest attempt is done; per-subject runs of X never satisfy it."
  applies_to: requires
  testable: true
  violation: "A successor starts on a superseded attempt's result, on another chain's run, or treats a fan-out's runs as the run it waits on."
- id: A126
  section: "3.7"
  rule: "An on_escalate target contains a step whose role is human, and its inputs read only the run's inputs and literals."
  applies_to: asop
  testable: true
  violation: "An escalation reaches a procedure no person takes part in."
- id: A127
  section: "3.7"
  rule: "When an ASOP declares `outcomes`, a run whose outcome is outside them files nothing and is refused handoff_refused:outcome."
  applies_to: handoff
  testable: true
  violation: "An undeclared outcome silently suppresses every hand-off."
- id: A128
  section: "3.7"
  rule: "A filing whose natural key was already filed with different inputs is refused handoff_refused:conflict."
  applies_to: handoff
  testable: true
  violation: "A chain run's inputs depend on which predecessor finished first."
- id: A129
  section: "3.7"
  rule: "An ASOP has at most one hand-off per target asop_id."
  applies_to: asop
  testable: true
  violation: "Two hand-offs to one target share natural keys and one silently becomes a duplicate."
- id: A130
  section: "3.7"
  rule: "At activation, the graph reachable from a record through hand-offs (escalations excluded, A132) has no cycle, and every hand-off target is handed exactly the inputs it declares."
  applies_to: asop
  testable: true
  violation: "A→B→A activates, or a target is left an input no filing can supply."
- id: A131
  section: "3.7"
  rule: "A join is blocked — surfaced to a person, never filed — when a refusal of one of its `after` hand-offs left a target unfiled, or one of their runs ended without done; a refused request blocks nothing, and a run re-run to done under its own key clears it."
  applies_to: join
  testable: true
  violation: "A join reads a refused fan-out or a failed run as finished, or one bad request holds it forever."
- id: A132
  section: "3.7"
  rule: "Escalation edges are excluded from cycle detection; at activation a record may not `require` an ASOP it can transitively hand off to."
  applies_to: asop
  testable: true
  violation: "A decision procedure that re-files the step that escalated is refused as a cycle, or a run waits on one that can exist only after it finishes."
- id: A133
  section: "3.7"
  rule: "A hand-off with `after` (a join) is `one` and names only hand-offs declared earlier in the same record, never itself."
  applies_to: asop
  testable: true
  violation: "A join fans out, or waits on a hand-off declared after it (or itself)."
- id: A134
  section: "3.7"
  rule: "A join that fires is not filed at completion but recorded as waiting; once ready it files one run whose subject is the chain, its target resolved then and its inputs read from the parent run. A parent's re-attempt retires the waiting joins of its earlier attempts."
  applies_to: handoff
  testable: true
  violation: "A join is filed before its runs are finished, against the version active at completion, or from a superseded attempt's fan-out."
- id: A135
  section: "3.3"
  rule: "A deterministic gate declaring `cannot_evaluate_exit` reaches `cannot_evaluate` on that exit status; it never releases dependents and is never charged to the executor."
  applies_to: gate
  testable: true
  violation: "An exit 3 from a gate that declared it is recorded as a failure and spends the executor's repair."
- id: A136
  section: "3.3"
  rule: "A deterministic gate declaring `min_cases` does not pass on exit 0 when the attestation ran fewer cases; the outcome is `cannot_evaluate`."
  applies_to: gate
  testable: true
  violation: "A suite that collected zero tests exits 0 and its step is recorded done."
- id: A137
  section: "3.3"
  rule: "An attestation for a gate declaring `min_cases` carries `cases_run`, a non-negative integer."
  applies_to: attestation
  testable: true
  violation: "Evidence for a case-floored gate omits the count."
- id: A138
  section: "3.3"
  rule: "`cannot_evaluate_exit` (1..255) and `min_cases` (>= 1) are declared on deterministic gates only."
  applies_to: gate
  testable: true
  violation: "A judged gate declares an exit status nothing reads, or a floor of zero cases."
- id: A139
  section: "3.3"
  rule: "`on_timeout: proceed_on_default` is declared on human gates only, with `default: {option, consequence, audience}`, each non-blank; `default` under any other `on_timeout` is refused."
  applies_to: gate
  testable: true
  violation: "A gate proceeds on a default with no consequence or audience, or a deterministic check proceeds on a default."
- id: A140
  section: "5.2"
  rule: "A gate declaring neither `cannot_evaluate_exit` nor `min_cases` has exactly its v3.5 outcomes."
  applies_to: gate
  testable: true
  violation: "An adopter's existing gate changes meaning on upgrade."
- id: A141
  section: "3.7"
  rule: "With `subject_from.order_by`, every filed run carries `depends_on` (natural keys); a dependency the hand-off does not file, or a cycle, refuses the hand-off (`order`), and requests that cause it are refused while the declaration files."
  applies_to: handoff
  testable: true
  violation: "A fan-out files a run that waits for a run nobody files, or one request makes a declared fan-out unfileable."
- id: A142
  section: "3.7"
  rule: "A fan-out's run may start only when every run in its `depends_on` is done and starting it keeps the hand-off's running runs within `concurrency`."
  applies_to: handoff
  testable: true
  violation: "A task starts before its prerequisite finished, or a wave exceeds its declared bound."
- id: A143
  section: "3.7"
  rule: "With `subject_from.approved_subset`, only subjects in an approval that binds the output's current digest are filed; a missing or stale approval, or one naming a subject the output lacks, refuses the hand-off (`approval`)."
  applies_to: handoff
  testable: true
  violation: "A changed plan is built on its predecessor's approval."
- id: A144
  section: "3.7"
  rule: "`human_approved` with `binds_digest` holds only when the approval's digest equals the artefact's current digest; a name alone fails closed."
  applies_to: requires
  testable: true
  violation: "A run starts on an approval of an earlier version of the artefact."
- id: A145
  section: "3.7"
  rule: "A `chain_gate` requirement is a deterministic gate over the run ledger and holds only when its outcome is `passed`."
  applies_to: requires
  testable: true
  violation: "A terminal procedure starts while the chain-level check failed or could not evaluate."
- id: A146
  section: "3.8"
  rule: "Entry gates are deterministic, read only declared inputs, and have unique ids."
  applies_to: asop
  testable: true
  violation: "An entry gate reads an undeclared input, or asks a judge."
- id: A147
  section: "3.8"
  rule: "Entry gate outcomes decide start, wait or not_ready: a refused gate over a handed-on input re-files its producer (charged only on `failed`), one over a source holds the run for a person, and the consumer is never charged."
  applies_to: entry
  testable: true
  violation: "A consumer's attempt is consumed because its input was broken, or a not-final source starts a procedure."
- id: A148
  section: "3.8"
  rule: "A hand-off declaring `preflight` targets a procedure with entry gates."
  applies_to: asop
  testable: true
  violation: "A preflight that checks nothing reports green."
- id: A149
  section: "3.9"
  rule: "A rework edge targets an earlier step on a later step's gate failure, or an upstream procedure on a declared outcome no hand-off fires on; it declares `max_rounds` 1..3 and `consumes_attempt`; one edge per trigger; `findings` is a declared output."
  applies_to: asop
  testable: true
  violation: "An unbounded loop, or a run that sends the same work forward and back."
- id: A150
  section: "3.9"
  rule: "A rework edge whose rounds are spent escalates; it never runs another round."
  applies_to: rework
  testable: true
  violation: "A rework loop runs a fourth autonomous round."
- id: A151
  section: "3.9"
  rule: "A procedure rework re-files the owner as its next attempt with the inputs it had and the findings as prior-findings context; without an owner it is refused."
  applies_to: rework
  testable: true
  violation: "The owner is re-filed with different inputs, without the findings, or a rework with no owner files something."
- id: A152
  section: "3.9"
  rule: "At activation a rework target is upstream (it hands off, transitively, to the record); rework edges are excluded from the hand-off cycle check."
  applies_to: asop
  testable: true
  violation: "A rework edge reaches a procedure downstream, escaping the cycle ban."
- id: A153
  section: "3.10"
  rule: "A pinned chain resolves every procedure it can reach once, at its start, one version per procedure; a chain that cannot be pinned whole is refused at its start."
  applies_to: manifest
  testable: true
  violation: "A chain starts with a member it can never file."
- id: A154
  section: "3.10"
  rule: "Under a manifest a reference resolves only to the pinned version, and only if that version satisfies the reference."
  applies_to: handoff
  testable: true
  violation: "A pinned chain files the version active now instead of the one it pinned."
- id: A155
  section: "3.10"
  rule: "An adoption records the two manifest digests, the computed impact (members and components) and a human adopter; any other record is refused."
  applies_to: manifest
  testable: true
  violation: "A chain moves to a new checker with no recorded decision, or a hand-typed impact report omits it."
- id: A156
  section: "5.6"
  rule: "A step's last journal entry decides its state; a step whose last entry is `started` was interrupted and resumes; `next` is the steps not done whose `after` are done."
  applies_to: journal
  testable: true
  violation: "A crash reads as a failure, or a resume skips a step."
- id: A157
  section: "5.4"
  rule: "Only failures classed `work` (or unclassified) count toward §5.4's budget; a crash, a `cannot_evaluate` and other fault classes do not."
  applies_to: journal
  testable: true
  violation: "An environment fault escalates good work to a person."
- id: A158
  section: "5.7"
  rule: "A run is stale when it read a changed artefact at a different digest; a question read while open is recorded with digest null, so writing its answer makes the run stale."
  applies_to: staleness
  testable: true
  violation: "A late answer leaves the work built on its default standing."
- id: A159
  section: "5.8"
  rule: "A chain is done when every latest attempt is done and its chain gate (if any) passed; failed when a latest attempt or the chain gate failed; open otherwise; procedures run at more than one version are reported."
  applies_to: chain
  testable: true
  violation: "A chain is reported done while its chain-level check could not evaluate, or two versions are averaged into one row."
- id: A160
  section: "3.10"
  rule: "A chain member's digest covers the record's validated body: optional fields absent or null are the same, the normalised gate carries every gate field (null where unset), and a record the contract refuses has no digest."
  applies_to: manifest
  testable: true
  violation: "Two stores holding the same record pin it under different digests because one digested the authored document and the other the normalised one."
- id: A161
  section: "3.10"
  rule: "The store-assigned fields asop_id, version, status, author, author_kind, superseded_by and created_at are excluded from a member digest."
  applies_to: manifest
  testable: true
  violation: "Activating or superseding a version changes its digest and strands every chain that pinned it."
- id: A162
  section: "3.10"
  rule: "The digest is 'sha256:' and 64 lowercase hex digits of SHA-256 over canonical JSON: keys sorted by code point, no whitespace, UTF-8 with only quote, backslash and U+0000-U+001F escaped, no Unicode normalization, decimal integers; floats and lone surrogates are refused."
  applies_to: manifest
  testable: true
  violation: "An implementation sorting keys by UTF-16, pretty-printing, NFC-normalising or printing a float computes a different string for the same record."
- id: A163
  section: "3.10"
  rule: "Any change to a record's validated body, including a change of code points that render alike, changes its digest."
  applies_to: manifest
  testable: true
  violation: "A changed procedure keeps the digest of the version a person adopted."
- id: A164
  section: "10"
  rule: "A store refuses to record a document that is not a valid asop.chain-manifest/1 with manifest_invalid, storing nothing."
  applies_to: manifest
  testable: true
  violation: "A malformed manifest is stored, or refused under a code another store does not use."
- id: A165
  section: "10"
  rule: "A store refuses a manifest pinning a version it does not hold, or holds only as a DRAFT, with manifest_member_unknown."
  applies_to: manifest
  testable: true
  violation: "A chain pins a draft or a version nobody holds, and resolves nothing."
- id: A166
  section: "10"
  rule: "A store refuses a manifest whose member digest is not the one it computes for that version (§3.10) with manifest_digest_mismatch."
  applies_to: manifest
  testable: true
  violation: "A manifest's digests mean whatever the engine typed."
- id: A167
  section: "10"
  rule: "Impact and adoption refuse an unrecorded chain with chain_unknown, and a target manifest not recorded for that chain with manifest_unknown."
  applies_to: manifest
  testable: true
  violation: "A chain adopts a manifest recorded for another chain, or an unknown chain reads as an empty one."
- id: A168
  section: "10"
  rule: "A store refuses an adoption that is not exactly the computed move with adoption_invalid."
  applies_to: manifest
  testable: true
  violation: "A hand-typed impact report is stored as an adoption."
- id: A169
  section: "3.7"
  rule: "An approval is a closed asop.approval/1: exact names, a non-empty digest, and a subset of unique string or integer ids; anything else is approval_invalid."
  applies_to: requires
  testable: true
  violation: "An approval with no digest, a boolean subject or a duplicate subject is stored and built on."
- id: A170
  section: "3.10"
  rule: "A run in a pinned chain files only at the version its manifest pins; another version, or a procedure it does not pin, is adoption_required."
  applies_to: manifest
  testable: true
  violation: "A pinned chain files the version active now."
- id: A171
  section: "10"
  rule: "A receiver whose contract does not implement a record kind refuses it with contract_unsupported, never storing it unvalidated."
  applies_to: manifest
  testable: true
  violation: "An older plane stores a record it cannot validate."
