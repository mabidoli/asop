# Conformance vectors — may a filed run START? (§3.7, v3.5)
#
# `requires` is declared on the procedure that waits, because it is the only
# one that sees every predecessor. Each vector gives the predicates, the
# chain's runs (`[asop_id, subject, attempt, done]`), the ASOPs a hand-off has
# already been processed toward, and the artefacts a declared human approved.

artifact: requires
vectors:
  - id: rq-join-waits-for-every-run
    asserts: [A124]
    requires: [{kind: all_runs_done, asop_id: extract}]
    runs: [[extract, s1, 1, true], [extract, s2, 1, false]]
    fanned_out: [extract]
    satisfied: false
    because: "one of two filed runs is still open"

  - id: rq-join-holds-when-all-done
    asserts: [A124]
    requires: [{kind: all_runs_done, asop_id: extract}]
    runs: [[extract, s1, 1, true], [extract, s2, 1, true]]
    fanned_out: [extract]
    satisfied: true
    because: "every filed run is done"

  - id: rq-join-waits-for-the-fan-out
    asserts: [A124]
    requires: [{kind: all_runs_done, asop_id: extract}]
    runs: []
    fanned_out: []
    satisfied: false
    because: "nothing has been fanned out yet, so 'all of none' is not yet true"

  - id: rq-empty-fan-out-satisfies-join
    asserts: [A124]
    requires: [{kind: all_runs_done, asop_id: extract}]
    runs: []
    fanned_out: [extract]
    satisfied: true
    because: "THE DEADLOCK CASE. The fan-out ran and its filter yielded nothing; a join waiting for runs that will never exist never fires"

  - id: rq-latest-attempt-counts
    asserts: [A125]
    requires: [{kind: run_done, asop_id: consolidate}]
    runs: [[consolidate, R1, 2, false], [consolidate, R1, 1, true]]
    satisfied: false
    because: "attempt 2 superseded attempt 1, whatever order the ledger lists them in"

  - id: rq-run-done-needs-a-run
    asserts: [A125]
    requires: [{kind: run_done, asop_id: consolidate}]
    runs: []
    satisfied: false
    because: "unlike a join, run_done is about a run that must exist"

  - id: rq-approval-required
    asserts: [A115]
    requires: [{kind: run_done, asop_id: consolidate}, {kind: human_approved, artefact: research-review}]
    runs: [[consolidate, R1, 1, true]]
    approved: []
    satisfied: false
    because: "every predicate must hold; the approval has not happened"

  - id: rq-all-predicates-hold
    asserts: [A115]
    requires: [{kind: run_done, asop_id: consolidate}, {kind: human_approved, artefact: research-review}]
    runs: [[consolidate, R1, 1, true]]
    approved: [research-review]
    satisfied: true
    because: "run done and approved"
