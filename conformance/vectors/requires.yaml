# Conformance vectors — may a filed run START? (§3.7, v3.5)
#
# `requires` names what a run needs from OUTSIDE its own fan-in: another
# procedure's CHAIN run done, or a person's approval. Waiting on a fan-out is a
# join, declared with `after` on the procedure that fanned out (join.yaml).
#
# Each vector gives the predicates, the chain id (default R1), the chain's runs
# as `[asop_id, subject, attempt, done]`, and the artefacts a declared human
# approved in this chain. X's chain run is the one whose subject is the chain —
# the run a `one` hand-off files.

artifact: requires
vectors:
  - id: rq-run-done-holds
    asserts: [A125]
    requires: [{kind: run_done, asop_id: conventions}]
    runs: [[conventions, R1, 1, true]]
    satisfied: true
    because: "the chain run of conventions is done"

  - id: rq-run-done-needs-a-run
    asserts: [A125]
    requires: [{kind: run_done, asop_id: conventions}]
    runs: []
    satisfied: false
    because: "nothing to be done yet; the engine's liveness clock, not this predicate, bounds the wait"

  - id: rq-run-done-still-open
    asserts: [A125]
    requires: [{kind: run_done, asop_id: conventions}]
    runs: [[conventions, R1, 1, false]]
    satisfied: false
    because: "filed is not done"

  - id: rq-latest-attempt-counts
    asserts: [A125]
    requires: [{kind: run_done, asop_id: conventions}]
    runs: [[conventions, R1, 2, false], [conventions, R1, 1, true]]
    satisfied: false
    because: "attempt 2 superseded attempt 1, whatever order the ledger lists them in"

  - id: rq-latest-attempt-counts-either-order
    asserts: [A125]
    requires: [{kind: run_done, asop_id: conventions}]
    runs: [[conventions, R1, 1, false], [conventions, R1, 2, true]]
    satisfied: true
    because: "the same rule read the other way: the re-run attempt 2 is done, so the failed attempt 1 no longer matters"

  - id: rq-per-subject-runs-are-not-the-chain-run
    asserts: [A125]
    requires: [{kind: run_done, asop_id: extract}]
    runs: [[extract, s1, 1, true], [extract, s2, 1, true]]
    satisfied: false
    because: "run_done names X's CHAIN run. Done per-subject runs do not satisfy it — waiting on a fan-out is a join (`after`), declared where the fan-out is"

  - id: rq-other-chain-ignored
    asserts: [A125]
    chain: R2
    requires: [{kind: run_done, asop_id: conventions}]
    runs: [[conventions, R1, 1, true]]
    satisfied: false
    because: "requires is evaluated within one chain; R1's run is not R2's"

  - id: rq-approval-required
    asserts: [A115]
    requires: [{kind: run_done, asop_id: conventions}, {kind: human_approved, artefact: research-review}]
    runs: [[conventions, R1, 1, true]]
    approved: []
    satisfied: false
    because: "every predicate must hold; the approval has not happened in this chain"

  - id: rq-all-predicates-hold
    asserts: [A115]
    requires: [{kind: run_done, asop_id: conventions}, {kind: human_approved, artefact: research-review}]
    runs: [[conventions, R1, 1, true]]
    approved: [research-review]
    satisfied: true
    because: "done and approved"

  - id: rq-integer-chain-subject
    asserts: [A125]
    chain: "7"
    requires: [{kind: run_done, asop_id: conventions}]
    runs: [[conventions, 7, 1, true]]
    satisfied: true
    because: "a subject is compared as a string, as the natural key spells it"

  # ---- v3.6 (§3.7) -------------------------------------------------------------
  - id: rq-bound-approval-current
    asserts: [A144]
    requires: [{kind: human_approved, artefact: plan, binds_digest: true}]
    approvals: {plan: {digest: "sha256:aa"}}
    digests: {plan: "sha256:aa"}
    satisfied: true

  - id: rq-bound-approval-stale
    asserts: [A144]
    requires: [{kind: human_approved, artefact: plan, binds_digest: true}]
    approvals: {plan: {digest: "sha256:aa"}}
    digests: {plan: "sha256:bb"}
    satisfied: false
    because: "the plan changed after the approval; it approved something else"

  - id: rq-bound-approval-name-only-fails-closed
    asserts: [A144]
    requires: [{kind: human_approved, artefact: plan, binds_digest: true}]
    approved: [plan]
    satisfied: false
    because: "a name cannot prove which version was approved"

  - id: rq-chain-gate-passed
    asserts: [A145]
    requires: [{kind: chain_gate, id: traced, gate: {kind: deterministic, check: "trace --ledger"}}]
    chain_gates: {traced: passed}
    satisfied: true

  - id: rq-chain-gate-cannot-evaluate-holds
    asserts: [A145]
    requires: [{kind: chain_gate, id: traced, gate: {kind: deterministic, check: "trace --ledger"}}]
    chain_gates: {traced: cannot_evaluate}
    satisfied: false
    because: "a chain gate that could not read the ledger proved nothing"
