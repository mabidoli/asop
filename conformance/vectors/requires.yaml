# Conformance vectors — may a filed run START? (§3.7, v3.5)
#
# `requires` is declared on the procedure that waits, because it is the only
# one that sees every predecessor. Each vector gives the predicates, the
# chain's runs as `[asop_id, subject, attempt, done, processed, refused_toward?]`,
# the predecessor graph (asop_id -> the ASOPs that can file it, from the active
# library), and the artefacts a declared human approved in this chain.
#
# X is SETTLED when no further run of X can be filed: every run of every ASOP
# that can transitively file X is done and processed, and none has a refused
# hand-off toward X or toward one of those ASOPs.

artifact: requires
x-preds: &preds {extract: [intake], consolidate: [extract]}
vectors:
  - id: rq-join-waits-for-every-run
    asserts: [A124]
    requires: [{kind: all_runs_done, asop_id: extract}]
    predecessors: *preds
    runs: [[intake, R1, 1, true, true], [extract, s1, 1, true, true], [extract, s2, 1, false, false]]
    satisfied: false
    because: "one of two filed runs is still open"

  - id: rq-join-holds-when-all-done
    asserts: [A124]
    requires: [{kind: all_runs_done, asop_id: extract}]
    predecessors: *preds
    runs: [[intake, R1, 1, true, true], [extract, s1, 1, true, true], [extract, s2, 1, true, true]]
    satisfied: true
    because: "the fan-out was processed and every run it filed is done"

  - id: rq-join-waits-for-processing
    asserts: [A124]
    requires: [{kind: all_runs_done, asop_id: extract}]
    predecessors: *preds
    runs: [[intake, R1, 1, true, false]]
    satisfied: false
    because: "the predecessor finished but its hand-offs are not yet recorded; more runs of extract may still be filed"

  - id: rq-empty-fan-out-satisfies-join
    asserts: [A124]
    requires: [{kind: all_runs_done, asop_id: extract}]
    predecessors: *preds
    runs: [[intake, R1, 1, true, true]]
    satisfied: true
    because: "THE DEADLOCK CASE. The fan-out ran and its filter yielded nothing; a join waiting for runs that will never exist never fires"

  - id: rq-refused-fan-out-blocks
    asserts: [A124]
    requires: [{kind: all_runs_done, asop_id: extract}]
    predecessors: *preds
    runs: [[intake, R1, 1, true, true, [extract]]]
    satisfied: false
    because: "a refused fan-out is a blocker for a person, never an empty result — otherwise the join starts on missing data"

  - id: rq-sibling-predecessor-still-open
    asserts: [A125]
    requires: [{kind: run_done, asop_id: consolidate}]
    predecessors: *preds
    runs: [[extract, s1, 1, true, true], [extract, s2, 1, false, false], [consolidate, R1, 1, true, true]]
    satisfied: false
    because: "THE EARLY-JOIN CASE. An open sibling can still hand off; the first predecessor to finish does not settle the successor"

  - id: rq-branch-never-taken
    asserts: [A124]
    requires: [{kind: all_runs_done, asop_id: consolidate}]
    predecessors: *preds
    runs: [[intake, R1, 1, true, true]]
    satisfied: true
    because: "intake's outcome closed the branch: no extract ran, so no consolidate can be filed — nothing to wait for"

  - id: rq-latest-attempt-counts
    asserts: [A125]
    requires: [{kind: run_done, asop_id: consolidate}]
    predecessors: *preds
    runs: [[consolidate, R1, 2, false, false], [consolidate, R1, 1, true, true]]
    satisfied: false
    because: "attempt 2 superseded attempt 1, whatever order the ledger lists them in"

  - id: rq-run-done-needs-a-run
    asserts: [A125]
    requires: [{kind: run_done, asop_id: consolidate}]
    predecessors: *preds
    runs: []
    satisfied: false
    because: "unlike a join, run_done is about a run that must exist"

  - id: rq-approval-required
    asserts: [A115]
    requires: [{kind: run_done, asop_id: consolidate}, {kind: human_approved, artefact: research-review}]
    predecessors: *preds
    runs: [[extract, s1, 1, true, true], [consolidate, R1, 1, true, true]]
    approved: []
    satisfied: false
    because: "every predicate must hold; the approval has not happened in this chain"

  - id: rq-all-predicates-hold
    asserts: [A115]
    requires: [{kind: run_done, asop_id: consolidate}, {kind: human_approved, artefact: research-review}]
    predecessors: *preds
    runs: [[extract, s1, 1, true, true], [consolidate, R1, 1, true, true]]
    approved: [research-review]
    satisfied: true
    because: "settled, done, approved"

  - id: rq-conflict-holds-the-waiter
    asserts: [A131]
    requires: [{kind: all_runs_done, asop_id: extract}]
    predecessors: *preds
    waiter: consolidate
    runs: [[intake, R1, 1, true, true], [extract, s1, 1, true, true], [extract, s2, 1, true, true, [consolidate]]]
    satisfied: false
    because: "extract is settled, but a refusal TOWARD the waiting join (a conflict on its own key) means what it would be handed is in dispute"

  - id: rq-reattempt-clears-the-block
    asserts: [A131]
    requires: [{kind: all_runs_done, asop_id: extract}]
    predecessors: *preds
    waiter: consolidate
    runs: [[intake, R1, 1, true, true], [extract, s1, 1, true, true], [extract, s2, 1, true, true, [consolidate]], [extract, s2, 2, true, true]]
    satisfied: true
    because: "a block clears only when the refusing run is superseded by a later attempt"
