# Conformance vectors — given a finished run, WHAT IS FILED NEXT? (§3.7, v3.5)
#
# A hand-off is a decision made from documents: the filing ASOP, the run's
# outcome and outputs, the requests it wrote, the successors' records, and what
# was filed before. Every input is here, so two engines reading this file must
# reach the same filings and the same refusals, in the same order.
#
# `library` is shared by every vector: asop_id -> {version: body}, where the
# version listed is the ACTIVE one. `existing` maps a natural key already filed
# to the inputs it was filed with. `expect` lists each decision as
# `file <asop_id>@<version> <subject>`, `duplicate <natural key>`,
# `wait <hand-off id>` (a join that fired and waits for its runs — see
# join.yaml), or `refuse <code>`, followed by ` -> <targets>` when the refusal leaves targets
# unfiled (its `toward`, which blocks a join over that hand-off). A vector with
# `join: <hand-off id>` asks instead what that join files once it is ready
# (`plan_join`). A refused REQUEST shows no arrow: it blocks nothing,
# because the declared hand-off still files without it. The ORDER IS NORMATIVE (§3.7): an undeclared outcome alone;
# otherwise each request in the order written, then each declared hand-off in
# declaration order, its subjects in output (or request) order.

artifact: handoff
library:
  intake:
    1:
      title: Frame the work
      inputs: [{name: root}]
      roles: {worker: {kind: agent}}
      steps: [{name: frame, role: worker, purpose: find the sources, gate: {kind: deterministic, check: make frame}}]
      outcomes: [FETCHED, NOTHING_TO_FETCH, BLOCKED]
      outputs: [{name: sources}]
      handoffs:
        - id: extract-each-source
          to: {asop_id: extract, versions: ">=2"}
          on_outcomes: [FETCHED, NOTHING_TO_FETCH]
          cardinality: many
          subject_from: {output: sources, array: sources, id_field: id, where: {kind: [spec, feature]}, where_not: {removed: true}}
          inputs: {source_id: $subject, root: $run.inputs.root}
        - id: consolidate
          to: {asop_id: consolidate, version: 1}
          on_outcomes: [FETCHED, NOTHING_TO_FETCH]
          after: [extract-each-source]
          inputs: {root: $run.inputs.root}
  extract:
    2:
      title: Extract one source
      inputs: [{name: source_id}, {name: root}]
      roles: {worker: {kind: agent}}
      steps: [{name: extract, role: worker, purpose: extract it, gate: {kind: deterministic, check: make extract}}]
      handoffs:
        - {id: index, to: {asop_id: index, version: 1}, inputs: {root: $run.inputs.root}}
  index:
    1:
      title: Index the chain
      inputs: [{name: root}]
      roles: {worker: {kind: agent}}
      steps: [{name: index, role: worker, purpose: index it, gate: {kind: deterministic, check: make index}}]
  sweep:
    1:
      title: Sweep the chain
      inputs: [{name: root}]
      roles: {worker: {kind: agent}}
      steps: [{name: sweep, role: worker, purpose: sweep it, gate: {kind: deterministic, check: make sweep}}]
      handoffs:
        - {id: index, to: {asop_id: index, version: 1}, inputs: {root: $run.inputs.root}}
        - {id: report, to: {asop_id: gone, versions: ">=1"}, after: [index], inputs: {root: $run.inputs.root}}
  consolidate:
    1:
      title: Consolidate
      inputs: [{name: root}]
      roles: {worker: {kind: agent}}
      steps: [{name: merge, role: worker, purpose: merge them, gate: {kind: deterministic, check: make merge}}]

  planner:
    1:
      title: Plan the work
      inputs: [{name: root}]
      roles: {worker: {kind: agent}}
      steps: [{name: plan, role: worker, purpose: cut the tasks, gate: {kind: deterministic, check: make plan}}]
      outputs: [{name: tasks}]
      handoffs:
        - id: build-each
          to: {asop_id: build, version: 1}
          cardinality: many
          subject_from: {output: tasks, array: tasks, id_field: id, order_by: depends_on, concurrency: 2, approved_subset: true}
          inputs: {task: $subject, root: $run.inputs.root}
  build:
    1:
      title: Build one task
      inputs: [{name: task}, {name: root}]
      roles: {worker: {kind: agent}}
      steps: [{name: build, role: worker, purpose: build it, gate: {kind: deterministic, check: make build}}]

x-sources: &sources
  sources:
    sources:
      - {id: s1, kind: spec}
      - {id: s2, kind: feature}
      - {id: s3, kind: ticket}
      - {id: s4, kind: spec, removed: true}

x-both: &both ["file extract@2 s1", "file extract@2 s2", "wait consolidate"]

x-tasks: &tasks
  tasks:
    tasks:
      - {id: T1, depends_on: []}
      - {id: T2, depends_on: [T1]}
      - {id: T3, depends_on: [T1, T2]}
x-approved: &approved {tasks: {digest: "sha256:aa"}}
x-digests: &digests {tasks: "sha256:aa"}
x-extract3: &extract3
  title: Extract one source, third version
  inputs: [{name: source_id}, {name: root}]
  roles: {worker: {kind: agent}}
  steps: [{name: extract, role: worker, purpose: extract it, gate: {kind: deterministic, check: make extract}}]

vectors:
  - id: ho-fan-out-expands-with-filters
    asserts: [A117, A118, A121]
    filer: intake
    outcome: FETCHED
    outputs: *sources
    run_inputs: {root: R1}
    expect: *both
    because: "s3 fails `where`, s4 hits `where_not`; the range >=2 resolves to the active v2 and pins it"

  - id: ho-outcome-not-listed-files-nothing
    asserts: [A117]
    filer: intake
    outcome: BLOCKED
    outputs: *sources
    run_inputs: {root: R1}
    expect: []
    because: "a hand-off that does not fire is not a refusal; it is the run saying stop"

  - id: ho-refuse-undeclared-outcome
    asserts: [A127]
    filer: intake
    outcome: OKAY
    outputs: *sources
    run_inputs: {root: R1}
    expect: ["refuse handoff_refused:outcome -> consolidate,extract"]
    because: "a closed set is closed: an outcome the ASOP never declared files nothing and says so, instead of silently suppressing every hand-off"

  - id: ho-empty-fan-out-files-nothing
    asserts: [A118]
    filer: intake
    outcome: NOTHING_TO_FETCH
    outputs: {sources: {sources: []}}
    run_inputs: {root: R1}
    expect: ["wait consolidate"]
    because: "zero subjects is a finished fan-out, not a failed one; its join is ready at once (join.yaml)"

  - id: ho-request-narrows-fan-out
    asserts: [A118]
    filer: intake
    outcome: FETCHED
    outputs: *sources
    run_inputs: {root: R1}
    requests: [{schema: asop.filing-request/1, handoff: extract-each-source, to: extract, subject: s2}]
    expect: ["file extract@2 s2", "wait consolidate"]
    because: "the run chose; the declaration bounded the choice"

  - id: ho-refuse-undeclared-handoff
    asserts: [A123]
    filer: intake
    outcome: FETCHED
    outputs: *sources
    run_inputs: {root: R1}
    requests: [{schema: asop.filing-request/1, handoff: extract-all, to: extract, subject: s1}]
    expect: ["refuse handoff_refused:undeclared", "file extract@2 s1", "file extract@2 s2", "wait consolidate"]
    because: "a refused request is as if it had not been written; the declared hand-off still fires in full"

  - id: ho-refuse-target-mismatch
    asserts: [A123]
    filer: intake
    outcome: FETCHED
    outputs: *sources
    run_inputs: {root: R1}
    requests: [{schema: asop.filing-request/1, handoff: extract-each-source, to: consolidate, subject: s1}]
    expect: ["refuse handoff_refused:undeclared", "file extract@2 s1", "file extract@2 s2", "wait consolidate"]
    because: "the hand-off exists, but not to that procedure — option C's whole point"

  - id: ho-refuse-wrong-outcome
    asserts: [A117, A123]
    filer: intake
    outcome: BLOCKED
    outputs: *sources
    run_inputs: {root: R1}
    requests: [{schema: asop.filing-request/1, handoff: extract-each-source, to: extract, subject: s1}]
    expect: ["refuse handoff_refused:outcome"]
    because: "a request cannot fire a hand-off its own outcome closed"

  - id: ho-refused-subject-does-not-cancel
    asserts: [A118, A123]
    filer: intake
    outcome: FETCHED
    outputs: *sources
    run_inputs: {root: R1}
    requests: [{schema: asop.filing-request/1, handoff: extract-each-source, to: extract, subject: s3}]
    expect: ["refuse handoff_refused:subject", "file extract@2 s1", "file extract@2 s2", "wait consolidate"]
    because: "THE SUPPRESSION CASE. s3 is filtered out, so the request is refused — and a refused request must not cancel the declared fan-out, or one bad request from a misbehaving run silences it"

  - id: ho-good-request-beside-a-bad-one
    asserts: [A118, A123]
    filer: intake
    outcome: FETCHED
    outputs: *sources
    run_inputs: {root: R1}
    requests:
      - {schema: asop.filing-request/1, handoff: extract-each-source, to: extract, subject: s9}
      - {schema: asop.filing-request/1, handoff: extract-each-source, to: extract, subject: s2}
    expect: ["refuse handoff_refused:subject", "file extract@2 s2", "wait consolidate"]
    because: "the accepted request still narrows; the refused one has no effect"

  - id: ho-refuse-request-with-inputs
    asserts: [A120, A123]
    filer: intake
    outcome: FETCHED
    outputs: *sources
    run_inputs: {root: R1}
    requests: [{schema: asop.filing-request/1, handoff: extract-each-source, to: extract, subject: s1, inputs: {root: ELSEWHERE}}]
    expect: ["refuse handoff_refused:malformed", "file extract@2 s1", "file extract@2 s2", "wait consolidate"]
    because: "a run chooses which, never what — a request carries no inputs"

  - id: ho-refuse-malformed
    asserts: [A123]
    filer: intake
    outcome: FETCHED
    outputs: *sources
    run_inputs: {root: R1}
    requests: [{handoff: extract-each-source, to: extract}]
    expect: ["refuse handoff_refused:malformed", "file extract@2 s1", "file extract@2 s2", "wait consolidate"]
    because: "no schema line; refused, never guessed at"

  - id: ho-refuse-output-shape
    asserts: [A123]
    filer: intake
    outcome: FETCHED
    outputs: {sources: {items: []}}
    run_inputs: {root: R1}
    expect: ["refuse handoff_refused:output -> extract", "wait consolidate"]
    because: "the output does not have the array the declaration names — a contract break between procedures, caught at the hand-off"

  - id: ho-refuse-ambiguous-subjects
    asserts: [A118, A123]
    filer: intake
    outcome: FETCHED
    outputs: {sources: {sources: [{id: 1, kind: spec}, {id: "1", kind: spec}]}}
    run_inputs: {root: R1}
    expect: ["refuse handoff_refused:output -> extract", "wait consolidate"]
    because: "1 and \"1\" are both subject \"1\"; which item was meant is not the engine's to guess"

  - id: ho-where-is-type-strict
    asserts: [A118]
    filer: intake
    outcome: FETCHED
    outputs: {sources: {sources: [{id: s1, kind: spec, removed: 1}, {id: s2, kind: spec, removed: true}]}}
    run_inputs: {root: R1}
    expect: ["file extract@2 s1", "wait consolidate"]
    because: "`where_not: {removed: true}` excludes true, not 1 — an engine with strict equality must agree"

  - id: ho-one-twice-refused-still-files
    asserts: [A119, A123]
    filer: extract
    run_inputs: {root: R1}
    requests:
      - {schema: asop.filing-request/1, handoff: index, to: index}
      - {schema: asop.filing-request/1, handoff: index, to: index}
    expect: ["refuse handoff_refused:cardinality", "file index@1 R1"]
    because: "`one` means one: the requests are refused and disregarded, and the declared hand-off still fires"

  - id: ho-chain-run-filed-once
    asserts: [A119, A122]
    filer: extract
    run_inputs: {root: R1}
    existing: {"R1|index|R1|a1": {root: R1}}
    expect: ["duplicate R1|index|R1|a1"]
    because: "the second of five extract runs handing off to one chain run: recorded, not refused, not filed. This is NOT a join — the run was filed by the FIRST extract to finish; to wait for all of them, declare a join (`after`) on the procedure that fanned out"

  - id: ho-chain-run-conflict
    asserts: [A128]
    filer: extract
    run_inputs: {root: R1}
    existing: {"R1|index|R1|a1": {root: ELSEWHERE}}
    expect: ["refuse handoff_refused:conflict -> index"]
    because: "the same run already filed with different inputs; which inputs it gets must not depend on who finished first"

  - id: ho-request-cannot-choose-join-subject
    asserts: [A119, A134]
    filer: intake
    outcome: FETCHED
    outputs: *sources
    run_inputs: {root: R1}
    requests: [{schema: asop.filing-request/1, handoff: consolidate, to: consolidate, subject: s1}]
    expect: ["file extract@2 s1", "file extract@2 s2", "refuse handoff_refused:subject", "wait consolidate"]
    because: "a join is `one`: its subject is the chain. The request is refused at the join's place in declaration order, and the join still waits"

  - id: ho-join-not-on-this-outcome
    asserts: [A117, A134]
    filer: intake
    outcome: BLOCKED
    outputs: *sources
    run_inputs: {root: R1}
    join: consolidate
    expect: []
    because: "a join fires on its own on_outcomes like any hand-off; BLOCKED fires neither the fan-out nor the join"

  - id: ho-join-files-when-ready
    asserts: [A134]
    filer: intake
    outcome: FETCHED
    outputs: *sources
    run_inputs: {root: R1}
    join: consolidate
    expect: ["file consolidate@1 R1"]
    because: "once join_state is ready, the join files ONE run whose subject is the chain, with inputs from the PARENT run"

  - id: ho-join-filed-once
    asserts: [A122, A134]
    filer: intake
    outcome: FETCHED
    outputs: *sources
    run_inputs: {root: R1}
    join: consolidate
    existing: {"R1|consolidate|R1|a1": {root: R1}}
    expect: ["duplicate R1|consolidate|R1|a1"]
    because: "a replayed join files nothing twice"

  - id: ho-join-conflict
    asserts: [A128, A134]
    filer: intake
    outcome: FETCHED
    outputs: *sources
    run_inputs: {root: R1}
    join: consolidate
    existing: {"R1|consolidate|R1|a1": {root: ELSEWHERE}}
    expect: ["refuse handoff_refused:conflict -> consolidate"]
    because: "another path filed the same chain run with different inputs: refused and recorded, never decided by who finished first"

  - id: ho-replay-files-nothing
    asserts: [A122]
    filer: intake
    outcome: FETCHED
    outputs: *sources
    run_inputs: {root: R1}
    existing: {"R1|extract|s1|a1": {source_id: s1, root: R1}, "R1|extract|s2|a1": {source_id: s2, root: R1}}
    expect: ["duplicate R1|extract|s1|a1", "duplicate R1|extract|s2|a1", "wait consolidate"]
    because: "a replayed ledger files nothing twice"

  - id: ho-stale-refile-next-attempt
    asserts: [A122]
    filer: intake
    outcome: FETCHED
    outputs: *sources
    run_inputs: {root: R1}
    attempt: 2
    existing: {"R1|extract|s1|a1": {source_id: s1, root: R1}}
    expect: *both
    because: "re-filing downstream of a stale input is a new attempt, not a duplicate"

  - id: ho-join-target-resolved-when-it-fires
    asserts: [A121, A134]
    filer: sweep
    run_inputs: {root: R1}
    join: report
    expect: ["refuse handoff_refused:version -> gone"]
    because: "a join's target resolves when the join fires, not when the parent finished; no active version in range then is refused, and blocks whatever waits on it"

  # ---- v3.6 (§3.7): ordered and approved fan-outs ---------------------------
  - id: ho-ordered-fan-out-carries-dependencies
    asserts: [A141, A143]
    filer: planner
    outputs: *tasks
    run_inputs: {root: R1}
    approvals: *approved
    output_digests: *digests
    expect: ["file build@1 T1", "file build@1 T2 after R1|build|T1|a1", "file build@1 T3 after R1|build|T1|a1,R1|build|T2|a1"]
    because: "each filed run names the runs it must wait for, as natural keys"

  - id: ho-refuse-dependency-not-filed
    asserts: [A141]
    filer: planner
    outputs: {tasks: {tasks: [{id: T1, depends_on: [T0]}]}}
    run_inputs: {root: R1}
    approvals: *approved
    output_digests: *digests
    expect: ["refuse handoff_refused:order -> build"]
    because: "a run waiting on a run nobody files never starts; refused whole, and the join over it is blocked"

  - id: ho-refuse-dependency-cycle
    asserts: [A141]
    filer: planner
    outputs: {tasks: {tasks: [{id: A, depends_on: [B]}, {id: B, depends_on: [A]}]}}
    run_inputs: {root: R1}
    approvals: *approved
    output_digests: *digests
    expect: ["refuse handoff_refused:order -> build"]

  - id: ho-order-breaking-request-is-disregarded
    asserts: [A141]
    filer: planner
    outputs: *tasks
    run_inputs: {root: R1}
    approvals: *approved
    output_digests: *digests
    requests: [{schema: asop.filing-request/1, handoff: build-each, to: build, subject: T3}]
    expect: ["refuse handoff_refused:order", "file build@1 T1", "file build@1 T2 after R1|build|T1|a1", "file build@1 T3 after R1|build|T1|a1,R1|build|T2|a1"]
    because: "a refused request is as if it had not been written: narrowing to T3 alone cannot make the declared fan-out unfileable"

  - id: ho-approved-subset-only
    asserts: [A143]
    filer: planner
    outputs: *tasks
    run_inputs: {root: R1}
    approvals: {tasks: {digest: "sha256:aa", subset: [T1, T2]}}
    output_digests: *digests
    expect: ["file build@1 T1", "file build@1 T2 after R1|build|T1|a1"]
    because: "a person approved two of the three tasks; the third is not filed"

  - id: ho-refuse-subset-missing-prerequisite
    asserts: [A141, A143]
    filer: planner
    outputs: *tasks
    run_inputs: {root: R1}
    approvals: {tasks: {digest: "sha256:aa", subset: [T2]}}
    output_digests: *digests
    expect: ["refuse handoff_refused:order -> build"]
    because: "approving a task without its prerequisite approves a run that can never start"

  - id: ho-refuse-stale-approval
    asserts: [A143]
    filer: planner
    outputs: *tasks
    run_inputs: {root: R1}
    approvals: *approved
    output_digests: {tasks: "sha256:bb"}
    expect: ["refuse handoff_refused:approval -> build"]
    because: "the plan changed after it was approved; the approval approved something else"

  - id: ho-refuse-no-approval
    asserts: [A143]
    filer: planner
    outputs: *tasks
    run_inputs: {root: R1}
    output_digests: *digests
    expect: ["refuse handoff_refused:approval -> build"]

  # ---- v3.6 (§3.10): a pinned chain resolves from its manifest -------------
  - id: ho-pinned-chain-files-the-pinned-version
    asserts: [A154]
    filer: intake
    outcome: FETCHED
    outputs: *sources
    run_inputs: {root: R1}
    pinned: {intake: 1, extract: 3}
    store: {extract: {3: *extract3}}
    expect: ["file extract@3 s1", "file extract@3 s2", "wait consolidate"]
    because: "the active version is 2, the chain pinned 3 at its start; a pinned chain never reaches for what is active now"

  - id: ho-pinned-outside-range-is-refused
    asserts: [A154]
    filer: intake
    outcome: FETCHED
    outputs: *sources
    run_inputs: {root: R1}
    pinned: {intake: 1, extract: 1}
    store: {extract: {1: *extract3}}
    expect: ["refuse handoff_refused:version -> extract", "wait consolidate"]
    because: "the pinned version does not satisfy the reference's range; there is no fallback to the active one"

