# Conformance vectors — what is a chain member's DIGEST? (§3.10, v3.6.1)
#
# A member digest is `sha256:` and 64 lowercase hex digits of SHA-256 over the
# canonical JSON of the record's VALIDATED body, store-assigned fields removed.
# Each vector gives an ASOP record as `document`, or as a `json` source string;
# `digest` is the string a conforming implementation must produce, byte for byte;
# `not_digest` is one it must NOT produce; `expect: refuse` means the record
# cannot be digested at all. The pinned string was cross-checked against an
# independent store's own digest function before it was written here.
#
# `dg-normalised-body-digests-the-same` carries the validated body itself, so an
# implementation can tell a normalisation difference from a serialization one.

artifact: digest
vectors:
