    asserts:
      - A160
      - A161
      - A162
    asop_id: intake
    document:
      title: Résumé intake — 日本
      task_type: intake
      purpose: Frame one source document.
      inputs: &id001
        - name: source
          description: the source document
      roles: &id002
        analyst:
          kind: agent
        owner:
          kind: human
      constraints: &id003
        - distinct:
            - analyst
            - owner
      outcomes: &id004
        - FRAMED
        - NOT_READY
      outputs: &id005
        - name: brief
      steps: &id006
        - name: frame
          role: analyst
          purpose: Write the brief.
          tags:
            - intake
          gate:
            kind: deterministic
            check: check-brief
            cannot_evaluate_exit: 3
            min_cases: 1
        - name: sign-off
          role: owner
          purpose: A person reads the brief.
          gate:
            kind: human
            check: the brief is right
            verifier: dana
            max_park_seconds: 86400
            on_timeout: escalate
            escalate_to: dana
    digest: sha256:81235e55f50bed91912dde6fb856bde8a05194f5bc72b2915884108eb28e6555
