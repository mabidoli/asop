# Conformance vectors — is the gate ANSWERED?
#
# The other two files ask whether a document is well formed. This one asks the
# question that actually gates work: given this gate and these attestations, may
# the step be recorded as done?
#
# The distinction is not academic. A failing attestation is a VALID document —
# refusing it would leave failure unrecordable — so an implementation that
# conflates "the evidence parsed" with "the gate passed" will mark a red test
# run as a green deployment, and every accept-vs-refuse vector in the suite will
# bless it. That gap was found by adversarial review, 2026-09-08.
#
# Each vector gives a gate and an ordered list of attestations; `satisfied` is
# what a conforming implementation must conclude.

artifact: satisfaction
vectors:
  - id: sat-single-passing
    asserts: [A008]
    gate: {kind: deterministic, check: "pytest -q"}
    attestations:
      - {check: "pytest -q", exit_status: 0, environment: "ci", at: "2026-09-08T09:00:00Z"}
    satisfied: true
    because: "one command, re-run, exited zero"

  - id: sat-single-failing
    asserts: [A008]
    gate: {kind: deterministic, check: "pytest -q"}
    attestations:
      - {check: "pytest -q", exit_status: 1, environment: "ci", at: "2026-09-08T09:00:00Z"}
    satisfied: false
    because: >-
      THE ONE THAT MATTERS. The document is valid and the gate is not answered.
      An implementation conflating the two ships red as green.

  - id: sat-no-evidence
    asserts: [A008]
    gate: {kind: deterministic, check: "pytest -q"}
    attestations: []
    satisfied: false
    because: "a gate nobody answered is not a gate that passed"

  - id: sat-staged-all-rungs
    asserts: [A105]
    gate: {kind: deterministic, checks: ["cargo fmt --check", "cargo test"]}
    attestations:
      - {check: "cargo fmt --check", stage: 0, exit_status: 0, environment: "ci", at: "2026-09-08T09:00:00Z"}
      - {check: "cargo test", stage: 1, exit_status: 0, environment: "ci", at: "2026-09-08T09:01:00Z"}
    satisfied: true
    because: "every rung climbed, every rung green"

  - id: sat-staged-missing-rung
    asserts: [A105]
    gate: {kind: deterministic, checks: ["cargo fmt --check", "cargo test"]}
    attestations:
      - {check: "cargo fmt --check", stage: 0, exit_status: 0, environment: "ci", at: "2026-09-08T09:00:00Z"}
    satisfied: false
    because: "a ladder with a missing rung is not a ladder that was climbed"

  - id: sat-staged-rung-failed
    asserts: [A105]
    gate: {kind: deterministic, checks: ["cargo fmt --check", "cargo test"]}
    attestations:
      - {check: "cargo fmt --check", stage: 0, exit_status: 0, environment: "ci", at: "2026-09-08T09:00:00Z"}
      - {check: "cargo test", stage: 1, exit_status: 1, environment: "ci", at: "2026-09-08T09:01:00Z"}
    satisfied: false
    because: "the cheapest rung passing does not carry the expensive one"

  - id: sat-staged-same-rung-twice
    asserts: [A008]
    gate: {kind: deterministic, checks: ["cargo fmt --check", "cargo test"]}
    attestations:
      - {check: "cargo fmt --check", stage: 0, exit_status: 0, environment: "ci", at: "2026-09-08T09:00:00Z"}
      - {check: "cargo fmt --check", stage: 0, exit_status: 0, environment: "ci", at: "2026-09-08T09:02:00Z"}
    satisfied: false
    because: >-
      Counting attestations rather than distinct rungs is the plausible
      implementation error, and re-running the cheap check twice is how it
      would be reached by accident rather than by malice.

  - id: sat-judged-positive-exit-0
    asserts:
    - A109
    gate: &id001
      kind: judged
      check: review output
    attestations:
    - check: review output
      exit_status: 0
      environment: review
      at: '2026-09-09T12:00:00Z'
      verdict: &id002
        passed: true
        reason: The output meets the check.
    satisfied: true
    because: Both execution and judgment must pass; conflicting signals block completion.
  - id: sat-judged-positive-exit-1
    asserts:
    - A109
    gate: *id001
    attestations:
    - check: review output
      exit_status: 1
      environment: review
      at: '2026-09-09T12:00:00Z'
      verdict: *id002
    satisfied: false
    because: Both execution and judgment must pass; conflicting signals block completion.
  - id: sat-judged-negative-exit-0
    asserts:
    - A109
    gate: *id001
    attestations:
    - check: review output
      exit_status: 0
      environment: review
      at: '2026-09-09T12:00:00Z'
      verdict: &id003
        passed: false
        reason: The output fails the check.
    satisfied: false
    because: Both execution and judgment must pass; conflicting signals block completion.
  - id: sat-judged-negative-exit-1
    asserts:
    - A109
    gate: *id001
    attestations:
    - check: review output
      exit_status: 1
      environment: review
      at: '2026-09-09T12:00:00Z'
      verdict: *id003
    satisfied: false
    because: Both execution and judgment must pass; conflicting signals block completion.
  - id: sat-human-positive-exit-0
    asserts:
    - A109
    gate: &id004
      kind: human
      check: review output
      verifier: reviewer
      max_park_seconds: 60
      on_timeout: fail
    attestations:
    - check: review output
      exit_status: 0
      environment: review
      at: '2026-09-09T12:00:00Z'
      verdict: &id005
        passed: true
        reason: The output meets the check.
    satisfied: true
    because: Both execution and judgment must pass; conflicting signals block completion.
  - id: sat-human-positive-exit-1
    asserts:
    - A109
    gate: *id004
    attestations:
    - check: review output
      exit_status: 1
      environment: review
      at: '2026-09-09T12:00:00Z'
      verdict: *id005
    satisfied: false
    because: Both execution and judgment must pass; conflicting signals block completion.
  - id: sat-human-negative-exit-0
    asserts:
    - A109
    gate: *id004
    attestations:
    - check: review output
      exit_status: 0
      environment: review
      at: '2026-09-09T12:00:00Z'
      verdict: &id006
        passed: false
        reason: The output fails the check.
    satisfied: false
    because: Both execution and judgment must pass; conflicting signals block completion.
  - id: sat-human-negative-exit-1
    asserts:
    - A109
    gate: *id004
    attestations:
    - check: review output
      exit_status: 1
      environment: review
      at: '2026-09-09T12:00:00Z'
      verdict: *id006
    satisfied: false
    because: Both execution and judgment must pass; conflicting signals block completion.

  # ---- v3.6 (§5.2): which outcome, not only whether it passed --------------
  - id: sat-zero-cases-exit-zero-is-refused
    asserts: [A136]
    gate: {kind: deterministic, check: "make test", min_cases: 1}
    attestations:
      - {check: "make test", exit_status: 0, environment: ci, at: "2026-10-16T09:00:00Z", cases_run: 0}
    satisfied: false
    outcome: cannot_evaluate
    because: >-
      THE EMPTY SUITE. The suite collected nothing and exited 0. Read as a pass,
      it merges work no test looked at; it is refused as a pass and reported as
      could-not-evaluate, which is never charged to the executor.

  - id: sat-enough-cases-passes
    asserts: [A136]
    gate: {kind: deterministic, check: "make test", min_cases: 1}
    attestations:
      - {check: "make test", exit_status: 0, environment: ci, at: "2026-10-16T09:00:00Z", cases_run: 41}
    satisfied: true
    outcome: passed

  - id: sat-declared-exit-is-cannot-evaluate
    asserts: [A135]
    gate: {kind: deterministic, check: "make test", cannot_evaluate_exit: 3}
    attestations:
      - {check: "make test", exit_status: 3, environment: ci, at: "2026-10-16T09:00:00Z"}
    satisfied: false
    outcome: cannot_evaluate
    because: "the check said it could not judge the work; that never releases dependents"

  - id: sat-other-exit-still-fails
    asserts: [A135]
    gate: {kind: deterministic, check: "make test", cannot_evaluate_exit: 3}
    attestations:
      - {check: "make test", exit_status: 1, environment: ci, at: "2026-10-16T09:00:00Z"}
    satisfied: false
    outcome: failed

  - id: sat-v35-gate-exit-three-is-a-failure
    asserts: [A140]
    gate: {kind: deterministic, check: "make test"}
    attestations:
      - {check: "make test", exit_status: 3, environment: ci, at: "2026-10-16T09:00:00Z", cases_run: 0}
    satisfied: false
    outcome: failed
    because: "COMPATIBILITY. A gate that declares neither field has the outcomes it had in v3.5: exit 3 is a failure"

  - id: sat-v35-gate-ignores-case-count
    asserts: [A140]
    gate: {kind: deterministic, check: "make test"}
    attestations:
      - {check: "make test", exit_status: 0, environment: ci, at: "2026-10-16T09:00:00Z", cases_run: 0}
    satisfied: true
    outcome: passed
    because: "COMPATIBILITY. Without min_cases the count is informational; the zero-case refusal is opt-in"

  - id: sat-ladder-first-rung-decides
    asserts: [A135]
    gate: {kind: deterministic, checks: ["make lint", "make test"], cannot_evaluate_exit: 3}
    attestations:
      - {check: "make lint", stage: 0, exit_status: 3, environment: ci, at: "2026-10-16T09:00:00Z"}
      - {check: "make test", stage: 1, exit_status: 1, environment: ci, at: "2026-10-16T09:00:00Z"}
    satisfied: false
    outcome: cannot_evaluate
    because: "the ladder stops at its first rung that did not pass; that rung could not evaluate"
