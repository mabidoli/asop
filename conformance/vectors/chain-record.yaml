# Conformance vectors — is this ASOP's CHAINING well formed? (§3.7, v3.5)
#
# Record-level checks only: everything here is decidable from the one record.
# Whether a target accepts what it is handed needs the other records and is
# answered at activation and again at filing (handoff.yaml).
#
# Each `document` is an ASOP body; `asop_id` is the id the store would give it.
# A refusal here is `sop_refused`, like every other record error (§10).

artifact: asop
x-base: &base
  title: A procedure
  inputs: [{name: root}]
  roles: {worker: {kind: agent}}
  steps: [{name: do, role: worker, purpose: do it, gate: {kind: deterministic, check: make check}}]

vectors:
  - id: cr-accept-standalone
    asserts: [A110]
    document: *base
    expect: accept
    because: "a v3.4 record is a valid v3.5 record"

  - id: cr-accept-full-chain
    asserts: [A111, A112, A113, A114, A115]
    asop_id: intake
    document:
      <<: *base
      outcomes: [FETCHED, BLOCKED]
      outputs: [{name: sources}]
      handoffs:
        - id: each
          to: {asop_id: extract, versions: ">=2,<4"}
          on_outcomes: [FETCHED]
          cardinality: many
          subject_from: {output: sources, array: sources, id_field: id, where: {kind: [spec]}}
          inputs: {source_id: $subject, root: $run.inputs.root, note: "$$literal"}
      on_escalate: {to: {asop_id: decide, version: 1}, inputs: {question_kind: escalation, root: $run.inputs.root}}
      requires: [{kind: human_approved, artefact: brief}]
    expect: accept
    because: "every chaining field, used as declared"

  - id: cr-refuse-undeclared-outcome
    asserts: [A111]
    document:
      <<: *base
      outcomes: [FETCHED]
      handoffs: [{id: h, to: {asop_id: next, version: 1}, on_outcomes: [FETCHD]}]
    expect: refuse
    refusal: sop_refused
    reaches: "not a declared outcome"
    because: "the misspelling that would otherwise never fire, silently"

  - id: cr-refuse-outcomes-not-declared
    asserts: [A111]
    document:
      <<: *base
      handoffs: [{id: h, to: {asop_id: next, version: 1}, on_outcomes: [DONE]}]
    expect: refuse
    refusal: sop_refused
    reaches: "declares no 'outcomes'"
    because: "an outcome vocabulary is declared before it is used"

  - id: cr-refuse-many-without-subject-from
    asserts: [A112]
    document:
      <<: *base
      handoffs: [{id: h, to: {asop_id: next, version: 1}, cardinality: many}]
    expect: refuse
    refusal: sop_refused
    reaches: "no 'subject_from'"
    because: "a fan-out over nothing"

  - id: cr-refuse-subject-from-undeclared-output
    asserts: [A112]
    document:
      <<: *base
      handoffs: [{id: h, to: {asop_id: next, version: 1}, cardinality: many, subject_from: {output: tasks, array: tasks, id_field: id}}]
    expect: refuse
    refusal: sop_refused
    reaches: "not a declared output"
    because: "a procedure fans out only over what it promises to write — the inter-procedure contract made checkable"

  - id: cr-refuse-subject-on-one
    asserts: [A113]
    document:
      <<: *base
      handoffs: [{id: h, to: {asop_id: next, version: 1}, inputs: {x: $subject}}]
    expect: refuse
    refusal: sop_refused
    reaches: "only on a `many`"
    because: "a `one` hand-off has no subject to read"

  - id: cr-refuse-undeclared-input-reference
    asserts: [A113]
    document:
      <<: *base
      handoffs: [{id: h, to: {asop_id: next, version: 1}, inputs: {x: $run.inputs.rot}}]
    expect: refuse
    refusal: sop_refused
    reaches: "does not declare"
    because: "a typo in a reference is refused where it is written"

  - id: cr-refuse-range-grammar
    asserts: [A114]
    document:
      <<: *base
      handoffs: [{id: h, to: {asop_id: next, versions: "^2"}}]
    expect: refuse
    refusal: sop_refused
    reaches: "only two forms"
    because: "a range two engines parse differently is a fork"

  - id: cr-refuse-pin-and-range
    asserts: [A114]
    document:
      <<: *base
      handoffs: [{id: h, to: {asop_id: next, version: 2, versions: ">=2"}}]
    expect: refuse
    refusal: sop_refused
    reaches: "exactly one of"
    because: "which one wins is exactly the question no record should leave open"

  - id: cr-refuse-engine-predicate
    asserts: [A115]
    document:
      <<: *base
      requires: [{kind: slot_free}]
    expect: refuse
    refusal: sop_refused
    reaches: "engine configuration"
    because: "concurrency is the same for every flow; it is not procedure data"

  - id: cr-refuse-invented-predicate
    asserts: [A115]
    document:
      <<: *base
      requires: [{kind: when_ready, asop_id: x}]
    expect: refuse
    refusal: sop_refused
    reaches: "closed"
    because: "the list grows by spec version, never by author"

  - id: cr-refuse-self-handoff
    asserts: [A116]
    asop_id: loop
    document:
      <<: *base
      handoffs: [{id: again, to: {asop_id: loop, version: 1}, inputs: {root: $run.inputs.root}}]
    expect: refuse
    refusal: sop_refused
    reaches: "its own ASOP"
    because: "a procedure that files itself has no bound"

  - id: cr-refuse-escalation-reads-outputs
    asserts: [A126]
    document:
      <<: *base
      outputs: [{name: o}]
      on_escalate: {to: {asop_id: decide, version: 1}, inputs: {q: $run.outputs.o}}
    expect: refuse
    refusal: sop_refused
    reaches: "never its outputs"
    because: "an escalation happens before the run has finished writing"

  - id: cr-refuse-two-handoffs-one-target
    asserts: [A129]
    document:
      <<: *base
      handoffs:
        - {id: a, to: {asop_id: next, version: 1}, inputs: {x: one}}
        - {id: b, to: {asop_id: next, version: 1}, inputs: {x: two}}
    expect: refuse
    refusal: sop_refused
    reaches: "One hand-off per target"
    because: "two hand-offs to one target share natural keys; which inputs a run gets would depend on order"

  - id: cr-refuse-subject-path
    asserts: [A113]
    document:
      <<: *base
      outputs: [{name: o}]
      handoffs: [{id: h, to: {asop_id: next, version: 1}, cardinality: many, subject_from: {output: o, array: items, id_field: id}, inputs: {x: $subject.m.n}}]
    expect: refuse
    refusal: sop_refused
    reaches: "one field"
    because: "`$subject.<field>` is one key; a path would be a second, unstated grammar"

  - id: cr-refuse-range-zero
    asserts: [A114]
    document:
      <<: *base
      handoffs: [{id: h, to: {asop_id: next, versions: ">=0"}}]
    expect: refuse
    refusal: sop_refused
    reaches: "only two forms"
    because: "versions start at 1"

  - id: cr-refuse-range-spaced
    asserts: [A114]
    document:
      <<: *base
      handoffs: [{id: h, to: {asop_id: next, versions: ">= 2"}}]
    expect: refuse
    refusal: sop_refused
    reaches: "only two forms"
    because: "one spelling, so the schema pattern and every parser agree"

  - id: cr-refuse-whitespace-name
    asserts: [A113]
    document:
      <<: *base
      handoffs: [{id: h, to: {asop_id: next, version: 1}, inputs: {"x ": one}}]
    expect: refuse
    refusal: sop_refused
    reaches: "surrounding whitespace"
    because: "names are matched exactly; stripping is how two keys collide"

  - id: cr-refuse-non-string-kind
    asserts: [A115]
    document:
      <<: *base
      requires: [{kind: [run_done], asop_id: x}]
    expect: refuse
    refusal: sop_refused
    reaches: "'kind' must be one of"
    because: "a refusal, not a crash"

  - id: cr-accept-join
    asserts: [A133]
    asop_id: intake
    document:
      <<: *base
      outcomes: [FETCHED, NOTHING_TO_FETCH]
      outputs: [{name: sources}]
      handoffs:
        - id: each
          to: {asop_id: extract, version: 2}
          cardinality: many
          subject_from: {output: sources, array: sources, id_field: id}
          inputs: {source_id: $subject, root: $run.inputs.root}
        - id: merge
          to: {asop_id: consolidate, version: 1}
          after: [each]
          inputs: {root: $run.inputs.root}
    expect: accept
    because: "the join lives on the procedure that fanned out, after the fan-out it waits on"

  - id: cr-refuse-join-fans-out
    asserts: [A133]
    document:
      <<: *base
      outputs: [{name: o}]
      handoffs:
        - {id: each, to: {asop_id: a, version: 1}, cardinality: many, subject_from: {output: o, array: items, id_field: id}}
        - {id: merge, to: {asop_id: b, version: 1}, cardinality: many, subject_from: {output: o, array: items, id_field: id}, after: [each]}
    expect: refuse
    refusal: sop_refused
    reaches: "Make it `one`"
    because: "a join files one run; fanning out again is the joined procedure's own hand-off"

  - id: cr-refuse-join-after-later
    asserts: [A133]
    document:
      <<: *base
      handoffs:
        - {id: merge, to: {asop_id: b, version: 1}, after: [each]}
        - {id: each, to: {asop_id: a, version: 1}}
    expect: refuse
    refusal: sop_refused
    reaches: "declared EARLIER"
    because: "a join names hand-offs declared before it, which also keeps joins acyclic"

  - id: cr-refuse-join-after-itself
    asserts: [A133]
    document:
      <<: *base
      handoffs:
        - {id: merge, to: {asop_id: b, version: 1}, after: [merge]}
    expect: refuse
    refusal: sop_refused
    reaches: "names itself"
    because: "a join waiting on itself never fires"

  - id: cr-refuse-all-runs-done
    asserts: [A115, A133]
    document:
      <<: *base
      requires: [{kind: all_runs_done, asop_id: extract}]
    expect: refuse
    refusal: sop_refused
    reaches: "procedure that fans out"
    because: "withdrawn before release: the waiting side cannot know which runs will ever be filed. The refusal says where a join goes instead"

  # ---- v3.6: entry gates (§3.8), rework (§3.9), typed fan-outs (§3.7) ------
  - id: cr-accept-entry-gate
    asserts: [A146]
    document:
      <<: *base
      entry_gates: [{id: root-ready, over: [root], gate: {kind: deterministic, check: "check-source --final", cannot_evaluate_exit: 3}}]
    expect: accept
    because: "a consumer's precondition over a declared input; a readiness gate is the same thing over a source"

  - id: cr-refuse-entry-gate-undeclared-input
    asserts: [A146]
    document:
      <<: *base
      entry_gates: [{id: g, over: [plan], gate: {kind: deterministic, check: "lint"}}]
    expect: refuse
    refusal: sop_refused
    reaches: "does not declare"
    because: "an entry gate checks what the run is handed, so it may read only declared inputs"

  - id: cr-refuse-entry-gate-judged
    asserts: [A146]
    document:
      <<: *base
      entry_gates: [{id: g, over: [root], gate: {kind: judged, check: "is it good"}}]
    expect: refuse
    refusal: sop_refused
    reaches: "deterministic"
    because: "an entry gate is run by the engine over documents; a judgment is a step"

  - id: cr-accept-step-rework
    asserts: [A149]
    document:
      <<: *base
      steps:
        - {name: write-tests, role: worker, purpose: write them, gate: {kind: deterministic, check: make t}}
        - {name: implement, role: worker, purpose: implement, gate: {kind: deterministic, check: make i}}
        - {name: prove, role: worker, purpose: prove they bite, gate: {kind: deterministic, check: make p}}
      rework: [{id: rewrite-tests, to: {step: 1}, on_step_failure: 3, max_rounds: 2, consumes_attempt: false}]
    expect: accept
    because: "tests that do not bite send the work back to the step that wrote them, at most twice"

  - id: cr-refuse-rework-forward
    asserts: [A149]
    document:
      <<: *base
      steps:
        - {name: a, role: worker, purpose: a, gate: {kind: deterministic, check: make a}}
        - {name: b, role: worker, purpose: b, gate: {kind: deterministic, check: make b}}
      rework: [{id: r, to: {step: 2}, on_step_failure: 1, max_rounds: 1, consumes_attempt: true}]
    expect: refuse
    refusal: sop_refused
    reaches: "not earlier"
    because: "rework goes back; a failing step re-running itself is a repair"

  - id: cr-refuse-rework-unbounded
    asserts: [A149]
    document:
      <<: *base
      steps:
        - {name: a, role: worker, purpose: a, gate: {kind: deterministic, check: make a}}
        - {name: b, role: worker, purpose: b, gate: {kind: deterministic, check: make b}}
      rework: [{id: r, to: {step: 1}, on_step_failure: 2, max_rounds: 9, consumes_attempt: true}]
    expect: refuse
    refusal: sop_refused
    reaches: "max_rounds"
    because: "a loop with no person in it is bounded by the contract, not by the author's optimism"

  - id: cr-refuse-rework-without-attempt-decision
    asserts: [A149]
    document:
      <<: *base
      steps:
        - {name: a, role: worker, purpose: a, gate: {kind: deterministic, check: make a}}
        - {name: b, role: worker, purpose: b, gate: {kind: deterministic, check: make b}}
      rework: [{id: r, to: {step: 1}, on_step_failure: 2, max_rounds: 1}]
    expect: refuse
    refusal: sop_refused
    reaches: "no default"
    because: "whether a round spends the repair budget is a decision; the contract will not guess it"

  - id: cr-accept-procedure-rework
    asserts: [A149]
    asop_id: review
    document:
      <<: *base
      outcomes: [ACCEPTED, PLAN_FINDINGS]
      outputs: [{name: findings}]
      rework: [{id: replan, to: {asop_id: plan, versions: ">=1"}, on_outcomes: [PLAN_FINDINGS], findings: findings, max_rounds: 2, consumes_attempt: false, tier_bump: true}]
    expect: accept
    because: "a review's findings go back to the procedure that owns them, carrying the findings, at most twice"

  - id: cr-refuse-rework-shares-outcome-with-handoff
    asserts: [A149]
    asop_id: review
    document:
      <<: *base
      outcomes: [ACCEPTED, PLAN_FINDINGS]
      handoffs: [{id: close, to: {asop_id: close, version: 1}, inputs: {root: $run.inputs.root}}]
      rework: [{id: replan, to: {asop_id: plan, version: 1}, on_outcomes: [PLAN_FINDINGS], max_rounds: 1, consumes_attempt: true}]
    expect: refuse
    refusal: sop_refused
    reaches: "does not also send it forward"
    because: "the hand-off fires on every completion, PLAN_FINDINGS included: one run would send the same work forward and back"

  - id: cr-refuse-rework-findings-undeclared
    asserts: [A149]
    asop_id: review
    document:
      <<: *base
      outcomes: [ACCEPTED, PLAN_FINDINGS]
      rework: [{id: replan, to: {asop_id: plan, version: 1}, on_outcomes: [PLAN_FINDINGS], findings: notes, max_rounds: 1, consumes_attempt: true}]
    expect: refuse
    refusal: sop_refused
    reaches: "not a declared output"
    because: "the findings carried upstream are something this procedure promises to write"

  - id: cr-accept-ordered-approved-fan-out
    asserts: [A141, A143]
    asop_id: planner
    document:
      <<: *base
      outputs: [{name: tasks}]
      handoffs:
        - id: build-each
          to: {asop_id: build, version: 1}
          cardinality: many
          subject_from: {output: tasks, array: tasks, id_field: id, order_by: depends_on, concurrency: 2, approved_subset: true}
          inputs: {task: $subject}
    expect: accept

  - id: cr-refuse-concurrency-zero
    asserts: [A142]
    document:
      <<: *base
      outputs: [{name: tasks}]
      handoffs:
        - id: build-each
          to: {asop_id: build, version: 1}
          cardinality: many
          subject_from: {output: tasks, array: tasks, id_field: id, concurrency: 0}
    expect: refuse
    refusal: sop_refused
    reaches: "concurrency must be a positive integer"

  - id: cr-accept-chain-gate-and-bound-approval
    asserts: [A144, A145]
    document:
      <<: *base
      requires:
        - {kind: human_approved, artefact: plan-approval, binds_digest: true}
        - {kind: chain_gate, id: every-requirement-traced, gate: {kind: deterministic, check: "trace --ledger"}}
    expect: accept

  - id: cr-refuse-chain-gate-human
    asserts: [A145]
    document:
      <<: *base
      requires: [{kind: chain_gate, id: sign-off, gate: {kind: human, check: "sign it", verifier: dana, max_park_seconds: 60, on_timeout: fail}}]
    expect: refuse
    refusal: sop_refused
    reaches: "deterministic"
    because: "a chain gate is the engine reading the ledger; a person's sign-off is a step"
