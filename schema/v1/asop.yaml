# =============================================================================
# ASOP record — the normative machine-readable schema.
#
# JSON Schema draft 2020-12, authored in YAML. References step.yaml (which
# references gate.yaml) as siblings; relative $refs resolve against the $ids.
#
# This schema is FOR the artefact that makes a procedure a standard rather
# than documentation: a versioned, ordered sequence of steps for one TYPE of
# task, which two organisations can run with different role bindings and
# still compare outcomes against, because outcomes are counted against the
# same version (ASOP.md §1). The ASOP never enters a work queue — runs do; a
# run pins (asop_id, version) and finishes under the version it started
# under. "Did the rewrite of step 2 help?" is answered by counting, never by
# recollection.
#
# This document describes the record as STORED and shared. At authoring time
# (`sop_create`, §8.1) the store assigns the identity — a new asop_id at v1,
# status `draft`, created_at — and the caller authors the body: title,
# task_type, purpose, trigger, inputs, roles, constraints, steps. `revise`
# never edits a version; it creates a new draft from an existing one.
#
# The decomposition bounds below are §3.1's and they are the discipline: a
# procedure sized to what an accountable person can sanity-check. One that
# needs more is usually two procedures — nest one (`uses`) instead.
# =============================================================================

$id: https://raw.githubusercontent.com/mabidoli/asop/main/schema/v1/asop.yaml
$schema: https://json-schema.org/draft/2020-12/schema
title: ASOP record
description: >-
  A versioned, ordered sequence of steps for one type of task: the shared
  artefact whose version a run pins, whose gates are authored with it, and
  whose per-version outcomes make revision an evidence question instead of a
  taste question.

type: object
additionalProperties: false
required:
  - asop_id
  - version
  - title
  - status
  - steps

properties:
  asop_id:
    description: >-
      Stable identity across versions. An id alone is not a version; a pin is
      both halves.
    $ref: '#/$defs/nonBlankString'

  version:
    type: integer
    minimum: 1
    description: >-
      Immutable once activated. `revise` creates a new version; it never
      edits this one — that is what makes outcomes comparable across
      revisions.

  title:
    description: What the procedure is called.
    $ref: '#/$defs/nonBlankString'

  status:
    enum:
      - draft       # being written; cannot be run; every field may change
      - active      # exactly one per asop_id at a time; immutable; runs file from it
      - superseded  # replaced by a later active version; kept forever — pins must stay resolvable
      - retired     # withdrawn, no successor; human-only; kept like superseded
    description: >-
      Lifecycle (§4). Running a draft hands somebody a half-written
      instruction with the authority of a published one, so filing refuses
      it; superseded and retired records are kept because a run pinned to
      them must stay resolvable or its outcomes become unreadable.

  task_type:
    description: >-
      The type of task this standardises, as a free label. `promote` refuses
      a second active ASOP for the same task_type; the path for a variant is
      a new version via `revise` (§6.5).
    $ref: '#/$defs/nonBlankString'

  purpose:
    description: What the procedure accomplishes, end to end.
    $ref: '#/$defs/nonBlankString'

  trigger:
    description: >-
      What situation calls for this procedure — declared on the ASOP, not on
      a step: a procedure is triggered, a step is reached.
    $ref: '#/$defs/nonBlankString'

  inputs:
    type: array
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          description: >-
            What a run must be given, by name; presence is checked at filing.
          $ref: '#/$defs/nonBlankString'
        description:
          description: >-
            What the input is, in the author's words — the contract checks
            presence, not shape; what an input IS is between the author and
            the harness.
          $ref: '#/$defs/nonBlankString'
        kind:
          # The accept-everything schema: RESERVED, optional and unvalidated
          # in v3 (§11.5). When a second harness disagrees with the first
          # about the shape of an input, the disagreement can be named
          # without a schema change; kinds get standardised from that
          # evidence, not guessed now.
          true
      description: One named run input.
    description: >-
      What a run must be supplied. Names are unique (checked where the ASOP
      is authored); `run` refuses when a declared input is missing.

  roles:
    type: object
    propertyNames:
      $ref: '#/$defs/nonBlankString'
    additionalProperties:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          enum:
            - agent   # filled by a binding the harness chooses at run time
            - human   # a person fills it; its steps carry human gates by construction
          description: >-
            Who may fill the role. A human role's steps must gate `human` —
            a human step an agent can close is not a human step (checked
            where the ASOP is authored).
    description: >-
      The ASOP names ROLES, never agents, models, vendors or people (§3.6);
      what fills each role is a harness decision at run time, which is what
      makes the artefact shareable — two organisations run the same version
      with different bindings and their outcomes still compare. Every step
      role must be declared here.

  constraints:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [distinct]
      properties:
        distinct:
          type: array
          minItems: 2
          uniqueItems: true
          items:
            $ref: '#/$defs/nonBlankString'
          description: >-
            Role names. The binding that fills one may not fill another IN
            THE SAME RUN — separation of duties over bindings, not over
            people. A harness that cannot satisfy a constraint refuses the
            run; it does not quietly bind the same agent twice.
    description: >-
      Separation of duties over roles. One constraint is required by
      construction and lives in the binding rules rather than this list: a
      judged step is evaluated by a route distinct from the executor's, so a
      validator over another step's output may not share that step's role.

  steps:
    type: array
    minItems: 1
    maxItems: 7
    items:
      $ref: 'step.yaml'
    description: >-
      The sequence, in order; each entry validates against step.yaml. An
      ASOP with no steps is a title. Seven at one level is the §3.1 bound —
      a human review bound, not an engineering one. Depth (nesting via
      `uses`) is bounded at 3 where the run tree is filed, because it is the
      tree that nests, not the record.

  # ---- chaining (§3.7, v3.5) ------------------------------------------------
  # All five are optional. A record without them is standalone, exactly as in
  # v3.4. A record WITH them is refused by a v3.4 reader — this schema is closed
  # (additionalProperties: false) and that is deliberate: a reader that dropped
  # the hand-offs it did not understand would run the procedure as a dead end.

  outcomes:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: '#/$defs/exactName'
    description: >-
      The closed set of outcomes a run of this procedure can finish with.
      Declared so that a hand-off's `on_outcomes` is checked where it is
      written: a misspelt outcome is refused at authoring, instead of being a
      hand-off that silently never fires.

  outputs:
    type: array
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/$defs/exactName'
        description:
          $ref: '#/$defs/exactName'
        kind:
          # Reserved and unvalidated, exactly as on inputs (§11.5).
          true
    description: >-
      What a run writes that a hand-off may read, by name. The mirror of
      `inputs`: what one procedure promises to write is what the next one is
      allowed to read, which is the inter-procedure contract that otherwise
      lives only in prose.

  handoffs:
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/handoff'
    description: >-
      Where a finished run MAY file next, and exactly what each successor is
      handed. Declared on the predecessor; fired by the engine when the run
      completes with an outcome in `on_outcomes`. A run may narrow a fan-out
      by naming subjects; anything else it asks for is refused
      (`handoff_refused:<rule>`) and has no effect on what was declared.

  on_escalate:
    type: object
    additionalProperties: false
    required: [to]
    properties:
      to:
        $ref: '#/$defs/target'
      inputs:
        $ref: '#/$defs/inputMap'
    description: >-
      The procedure an escalation files (§5.4's second failure). Its target
      must contain a step a human role does, and its inputs read only the
      run's inputs and literals — an escalation happens before the run has
      finished writing its outputs.

  requires:
    type: array
    minItems: 1
    items:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, asop_id]
          properties:
            kind: {enum: [run_done, all_runs_done]}
            asop_id: {$ref: '#/$defs/exactName'}
        - type: object
          additionalProperties: false
          required: [kind, artefact]
          properties:
            kind: {const: human_approved}
            artefact: {$ref: '#/$defs/exactName'}
    description: >-
      When a filed run may START. Declared on the successor — the only
      procedure that sees every predecessor — and evaluated within one chain.
      The kinds are a closed list; concurrency, staleness and duplicate
      suppression are engine duties, not predicates (§3.7).

  author:
    description: Who wrote this version.
    $ref: '#/$defs/nonBlankString'

  author_kind:
    enum: [human, agent]
    description: >-
      Set by the operator, never inferred from a name. The revision policy's
      rules compute from this field, which is why it exists: versions are
      immutable and each records who authored it, so "an agent may not undo a
      human" is computable rather than aspirational (§6.4).

  proposals:
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/nonBlankString'
    description: >-
      Open revision proposals carried until the next reviser addresses or
      dismisses them. A proposal is a draft, never an activation.

  superseded_by:
    type: [integer, 'null']
    minimum: 1
    description: >-
      The version that replaced this one, once one does. Kept rather than
      deleted; null (or absent) until then, as in the published example
      record.

  created_at:
    type: string
    format: date-time
    description: When this version was created.

# ---------------------------------------------------------------------------
# Cross-record rules JSON Schema cannot express. Every conforming
# implementation enforces these where the record is authored (`sop_create`)
# or a run is filed (`run`); they are listed here because adopters read
# schemas to learn intent, and each names its refusal code (§10).
# ---------------------------------------------------------------------------
x-asop-cross-checks:
  rules:
    - {check: "a step's `role` is declared in `roles`", refusal: "sop_refused"}
    - {check: "a role of kind `human` gates its steps `human`", refusal: "sop_refused"}
    - {check: "a step carrying a protected tag (`money`, `irreversible` by default) gates `human` — the tag means a person looks before the step counts as done", refusal: "sop_refused"}
    - {check: "a `judged` step's role differs from the role of every step it is `after` — the judge is a route distinct from the executor's", refusal: "sop_refused"}
    - {check: "`after` names only existing, lower-numbered steps; no cycles", refusal: "sop_refused"}
    - {check: "each step's declared `step` number equals its array position", refusal: "sop_refused"}
    - {check: "`inputs` names are unique", refusal: "sop_refused"}
    - {check: "`constraints[].distinct` names only declared roles", refusal: "sop_refused"}
    - {check: "at filing: the pinned version is ACTIVE", refusal: "sop_refused"}
    - {check: "at filing: every declared input is supplied", refusal: "inputs_missing"}
    - {check: "at filing: every role resolves to a binding satisfying every constraint", refusal: "role_unbound | constraint_unsatisfiable"}
    - {check: "the filed run tree nests at most 3 deep (width is bounded by the step count)", refusal: "decomposition_bound"}
    - {check: "a hand-off's `on_outcomes` names only declared `outcomes`", refusal: "sop_refused"}
    - {check: "a `many` hand-off has `subject_from`, whose `output` is a declared output; a `one` hand-off has none", refusal: "sop_refused"}
    - {check: "input references are `$subject[.<field>]` (on `many` only), `$run.inputs.<declared>`, `$run.outputs.<declared>`; `$$` is a literal `$`", refusal: "sop_refused"}
    - {check: "a target carries exactly one of `version` and `versions`; `versions` is '>=N' or '>=N,<M'", refusal: "sop_refused"}
    - {check: "no hand-off, escalation or `requires` names the record's own asop_id", refusal: "sop_refused"}
    - {check: "an `on_escalate` reads no `$run.outputs`", refusal: "sop_refused"}
    - {check: "at activation: every hand-off target resolves and is handed exactly the inputs it declares (a run cannot fill a gap — requests carry no inputs)", refusal: "sop_refused"}
    - {check: "at activation: an `on_escalate` target has a step whose role is human", refusal: "sop_refused"}
    - {check: "a `versions` range '>=N,<M' has M > N", refusal: "sop_refused"}
    - {check: "`outputs` names are unique; `outcomes` and `on_outcomes` entries are unique", refusal: "sop_refused"}
    - {check: "at most one hand-off per target asop_id", refusal: "sop_refused"}
    - {check: "`$subject.<field>` names one key (no dots); `subject_from.array` is dot-separated keys", refusal: "sop_refused"}
    - {check: "names (ids, input keys, where keys, outcomes, outputs, artefacts) carry no surrounding whitespace", refusal: "sop_refused"}
    - {check: "at activation: the hand-off graph reachable through hand-offs and escalations has no cycle", refusal: "sop_refused"}
    - {check: "at filing: every hand-off decision matches handoff.yaml's rules", refusal: "handoff_refused:<rule>"}

$defs:
  target:
    type: object
    additionalProperties: false
    required: [asop_id]
    properties:
      asop_id: {$ref: '#/$defs/exactName'}
      version: {type: integer, minimum: 1}
      versions:
        type: string
        # ASCII digits, no spaces, N >= 1. M > N is a cross-check (below):
        # a pattern cannot compare two numbers.
        pattern: '^>=[1-9][0-9]*(,<[1-9][0-9]*)?$'
    oneOf:
      - required: [version]
      - required: [versions]
    description: >-
      A pin, or a range resolved at filing to the ACTIVE version inside it.
      Either way the filed run pins one version — outcomes still attach to a
      version, never to a range.

  exactName:
    # A name matched exactly: non-blank, no surrounding whitespace. Refused
    # rather than stripped — stripping is how `a` and ` a` collide.
    type: string
    pattern: '^\S(.*\S)?$'

  inputMap:
    type: object
    propertyNames: {$ref: '#/$defs/exactName'}
    additionalProperties:
      type: [string, number, boolean]
    description: >-
      Successor input name -> a reference (`$subject`, `$subject.<field>`,
      `$run.inputs.<name>`, `$run.outputs.<name>`) or a scalar literal. A
      literal beginning with `$` is written `$$`.

  handoff:
    type: object
    additionalProperties: false
    required: [id, to]
    properties:
      id:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
      to: {$ref: '#/$defs/target'}
      on_outcomes:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/exactName'}
      cardinality:
        enum: [one, many]
        default: one
      subject_from:
        type: object
        additionalProperties: false
        required: [output, array, id_field]
        properties:
          output: {$ref: '#/$defs/exactName'}
          array: {$ref: '#/$defs/exactName'}
          id_field: {$ref: '#/$defs/exactName'}
          where:
            type: object
            minProperties: 1
            additionalProperties:
              anyOf:
                - type: [string, number, boolean]
                - {type: array, minItems: 1, items: {type: [string, number, boolean]}}
          where_not:
            type: object
            minProperties: 1
            additionalProperties: {type: [string, number, boolean]}
      inputs: {$ref: '#/$defs/inputMap'}
    if:
      properties: {cardinality: {const: many}}
      required: [cardinality]
    then:
      required: [subject_from]
    else:
      not: {required: [subject_from]}

  # See gate.yaml: presence means valued, and blank is not a value.
  nonBlankString:
    type: string
    minLength: 1
    pattern: '\S'
