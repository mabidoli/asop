# =============================================================================
# Filing request — a finished run's own choice of what to file next (§3.7).
#
# JSON Schema draft 2020-12, authored in YAML. Written by a run's final step,
# zero or more per run. A request NARROWS a declared fan-out by naming
# subjects; it never creates a hand-off and carries no inputs — a run chooses
# WHICH, never WHAT. Anything else is refused as `handoff_refused:<rule>` and
# recorded, and a refused request has no effect on what the ASOP declared:
# never repaired, never silently dropped, never able to cancel a filing.
# =============================================================================

$id: https://raw.githubusercontent.com/mabidoli/asop/main/schema/v1/filing-request.yaml
$schema: https://json-schema.org/draft/2020-12/schema
title: Filing request
type: object
additionalProperties: false
required: [schema, handoff, to]
properties:
  schema:
    const: asop.filing-request/1
  handoff:
    description: The id of a hand-off the filing ASOP declares.
    type: string
    pattern: '^\S([\s\S]*\S)?$'
  to:
    description: The asop_id that hand-off targets. Must match it.
    type: string
    pattern: '^\S([\s\S]*\S)?$'
  subject:
    description: >-
      On a `many` hand-off, one subject its `subject_from` yields. Forbidden
      on a `one` hand-off, whose subject is the chain.
    oneOf:
      - type: string
        pattern: '^\S([\s\S]*\S)?$'
      - type: integer
  reason:
    description: Why, in the run's words. Recorded with the filing.
    type: string
    minLength: 1
    pattern: '\S'
