# =============================================================================
# Chain manifest — one pin for a whole chain (ASOP.md §3.10, v3.6).
#
# JSON Schema draft 2020-12, authored in YAML. Written by the engine at chain
# start: every procedure the chain can reach, resolved ONCE to one version, and
# the digests of whatever else gives its gates their meaning (`components`: a
# checker, an orchestration rules file). The chain resolves from this document
# for the rest of its life; moving it needs a recorded adoption
# (adoption.yaml). Members and components are sorted, so a manifest has one
# spelling and one digest: sha256 over its canonical JSON (sorted keys, no
# whitespace, UTF-8), which is why nothing in it is a float.
# =============================================================================

$id: https://raw.githubusercontent.com/mabidoli/asop/main/schema/v1/chain-manifest.yaml
$schema: https://json-schema.org/draft/2020-12/schema
title: Chain manifest
type: object
additionalProperties: false
required: [schema, chain, start, members]
properties:
  schema:
    const: asop.chain-manifest/1
  chain:
    $ref: '#/$defs/exactName'
    description: The chain this pins — the scope of every natural key in it.
  start:
    type: object
    additionalProperties: false
    required: [asop_id, version]
    properties:
      asop_id: {$ref: '#/$defs/exactName'}
      version: {type: integer, minimum: 1}
    description: The procedure that started the chain; one of the members.
  members:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [asop_id, version, digest]
      properties:
        asop_id: {$ref: '#/$defs/exactName'}
        version: {type: integer, minimum: 1}
        digest:
          $ref: '#/$defs/digest'
          description: The member digest of ASOP.md §3.10 (normative since v3.6.1) — computed, not chosen.
    description: >-
      One entry per procedure, sorted by asop_id — a chain runs ONE version of
      each (a cross-check: asop_ids are unique). `uses` targets are not listed:
      a nested step already pins an exact version inside the member's record.
  components:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, digest]
      properties:
        name: {$ref: '#/$defs/exactName'}
        version:
          $ref: '#/$defs/exactName'
          description: A string, so `29` and `"29"` are not two spellings of one pin.
        digest: {$ref: '#/$defs/digest'}
    description: >-
      Everything outside the procedures that changes what a gate means, sorted
      by name. A step pin without the checker that runs its gate is half a pin.
$defs:
  digest:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
  exactName:
    type: string
    pattern: '^\S([\s\S]*\S)?$'
